name: Keep the database awake
# The free Supabase plan pauses a project that nobody has used for about a week.
# This sends one harmless request (it reads nothing private) every few days so a quiet week cannot take the app down.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          set -e
          curl -fsS -m 30 -X POST "https://eauzvihirpfcjkwyqgel.supabase.co/rest/v1/rpc/app_ping" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" -d '{}'
        env:
          # the public (publishable) key that is already inside index.html; it is not a secret
          KEY: sb_publishable_TYxnhvbPvCHCycPFWioahA_k16FmgnQ
