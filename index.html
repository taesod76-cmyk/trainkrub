<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เทรนครับ (TRAINKRUB)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a0a;--surface:#161212;--surface-2:#1f1919;--surface-3:#2a2222;
    --line:rgba(245,238,232,0.09);--line-strong:rgba(245,238,232,0.16);
    --red:#e0293f;--red-dim:#7d1a23;--red-glow:rgba(224,41,63,0.18);
    --text:#f5efe9;--text-dim:#9c9291;--text-faint:#5f5654;
    --font-display:'Anton', sans-serif;--font-body:'Work Sans', sans-serif;--font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh;width:100%;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:var(--font-body);cursor:pointer}
  ::selection{background:var(--red);color:#fff}
  button,.day-pill,.time-slot,.nav button,.role-tab button,.cat-pill{transition:transform .12s ease,background .15s ease,color .15s ease,border-color .15s ease}
  button:active,.day-pill:active,.time-slot:active,.nav button:active,.role-tab button:active,.cat-pill:active{transform:scale(0.94)}

  .shell{max-width:1180px;margin:0 auto;padding:0 24px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .brand-mark{width:46px;height:46px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;color:#0c0a0a;flex-shrink:0;object-fit:cover;border:1px solid var(--line-strong);box-shadow:0 6px 18px -4px rgba(224,41,63,0.5)}
  .brand-text{line-height:1.15}
  .name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wordmark{background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:3px 8px;border-radius:5px;text-transform:uppercase;font-family:var(--font-body);box-shadow:0 3px 10px -2px rgba(224,41,63,0.6)}
  .brand-text .name{font-family:var(--font-display);font-size:20px;letter-spacing:0.4px}
  .brand-text .sub{font-size:11px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

  .top-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lang-toggle{display:flex;border:1px solid var(--line-strong);border-radius:99px;padding:3px;gap:2px}
  .lang-toggle button{border:none;background:transparent;color:var(--text-dim);font-size:11px;font-weight:700;padding:7px 12px;border-radius:99px;letter-spacing:0.5px}
  .lang-toggle button.active{background:var(--surface-3);color:var(--text)}

  .user-chip{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);border:1px solid var(--line-strong);border-radius:99px;padding:6px 8px 6px 14px}
  .user-chip.show{display:inline-flex}
  .user-chip b{color:var(--text);font-weight:600}
  .user-chip .role-pill{background:var(--red-glow);color:var(--red);font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.4px}
  .user-chip button{border:none;background:var(--surface-2);color:var(--text-dim);font-size:11px;font-weight:600;padding:6px 11px;border-radius:99px}
  .user-chip button:hover{color:var(--text);background:var(--surface-3)}

  .nav{display:flex;gap:4px;padding:14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .nav::-webkit-scrollbar{display:none;height:0}
  .nav button{border:none;background:transparent;color:var(--text-dim);font-size:13px;font-weight:500;padding:9px 16px;border-radius:8px;white-space:nowrap;position:relative}
  .nav button:hover{color:var(--text);background:var(--surface-2)}
  .nav button.active{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .nav .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text-faint);margin-right:8px;vertical-align:middle}
  .nav button.active .dot{background:var(--red)}
  .nav .count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin-left:7px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700}

  .view{padding:36px 0 64px}
  .anim-in{animation:fadeSlide .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .page-head{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .page-head .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:8px}
  .page-head h1{font-family:var(--font-display);font-size:32px;font-weight:400;letter-spacing:0.3px}
  .page-head p{color:var(--text-dim);font-size:14px;margin-top:6px;max-width:560px}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
  /* Grid/flex children default to min-width:auto, which lets an item with a
     wide intrinsic minimum (a <select> sizes itself to its longest option,
     a long unbroken string, a table) push the whole track past the viewport.
     Pinning them to 0 lets the track actually shrink on small screens. */
  .grid-2>*,.grid-3>*,.grid-4>*{min-width:0}
  .card{min-width:0}
  select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{min-width:0;max-width:100%}
  select{text-overflow:ellipsis}
  @media(min-width:821px){.c-dash-pkg{order:2}.c-dash-main{order:1}}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr}}
  @media(max-width:520px){.grid-4{grid-template-columns:1fr}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
  .card:last-child{margin-bottom:0}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
  .card-head h3{font-size:15px;font-weight:600}
  .card-head .hint{font-size:12px;color:var(--text-faint)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:12px 20px;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);letter-spacing:0.2px}
  .btn:hover{background:var(--surface-3);border-color:var(--text-faint)}
  .btn:disabled{opacity:0.4;pointer-events:none}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn-primary:hover{background:#f13650;border-color:#f13650}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
  .btn-danger-outline{background:transparent;border-color:var(--red-dim);color:#f0838f}
  .btn-danger-outline:hover{background:rgba(224,41,63,0.1)}
  .btn-sm{padding:8px 14px;font-size:12px}
  .btn-block{width:100%}

  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
  input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);border-radius:9px;padding:12px 14px;font-size:14px;font-family:var(--font-body);outline:none;resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:var(--red)}
  .field{margin-bottom:16px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.field-row{grid-template-columns:1fr}}

  .search-row{display:flex;gap:10px;margin-bottom:18px}
  .trainer-row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface-2);flex-wrap:wrap}
  .trainer-row.pinned{border-color:var(--red-dim);background:rgba(224,41,63,0.06)}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--red);flex-shrink:0;border:1px solid var(--line-strong)}
  .trainer-row .meta{flex:1;min-width:140px}
  .trainer-row .meta .n{font-weight:600;font-size:14px}
  .trainer-row .meta .s{font-size:12px;color:var(--text-faint)}
  .trainer-row .actions{display:flex;gap:8px;flex-wrap:wrap}
  .pin-btn{background:transparent;border:1px solid var(--line-strong);color:var(--text-faint);border-radius:9px;width:40px;height:40px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;line-height:1}
  .pin-btn:hover{border-color:var(--text-dim);color:var(--text-dim)}
  .pin-btn.pinned{background:var(--red-glow);border-color:var(--red);color:var(--red)}
  .badge-pinned{background:var(--red-glow);color:var(--red)}

  .cat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .cat-pill{flex:1 1 140px;text-align:center;padding:12px 8px;border-radius:10px;border:1px solid var(--line-strong);font-size:12px;font-weight:600;background:transparent;color:var(--text-dim);line-height:1.4}
  .cat-pill.sel{background:var(--red);border-color:var(--red);color:#fff}

  .day-strip{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
  .day-pill{flex-shrink:0;width:64px;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--line-strong)}
  .day-pill .d{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px}
  .day-pill .n{font-family:var(--font-mono);font-size:14px;font-weight:600;margin-top:3px}
  .day-pill.sel{background:var(--red);border-color:var(--red)}
  .day-pill.sel .d,.day-pill.sel .n{color:#fff}

  .time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
  @media(max-width:480px){.time-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:360px){.time-grid{grid-template-columns:repeat(2,1fr)}}
  .time-slot{padding:11px 0;text-align:center;border-radius:9px;border:1px solid var(--line-strong);font-size:13px;font-family:var(--font-mono);position:relative}
  .time-slot.sel{background:var(--red);border-color:var(--red);color:#fff}
  .time-slot.taken{opacity:0.3;pointer-events:none;text-decoration:line-through}
  /* one customer has already requested this slot — still bookable, and the
     trainer decides afterwards whether to run it as a pair session */
  .time-slot.duo-open{border-color:#f0ab3c;color:#f0ab3c}
  .time-slot.duo-open.sel{background:var(--red);border-color:var(--red);color:#fff}
  .time-slot.duo-open::after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#f0ab3c}
  .time-slot.duo-open.sel::after{background:#fff}
  .slot-hint{font-size:11px;color:var(--text-faint);line-height:1.6;margin:-4px 0 12px}
  /* full explanation shown once an amber (pair-open) slot is actually picked */
  .duo-notice{display:flex;gap:12px;align-items:flex-start;border:1px solid #f0ab3c;border-radius:12px;padding:14px;margin:0 0 14px;background:rgba(240,171,60,0.07)}
  .duo-notice .dn-icon{font-size:20px;line-height:1.2;flex-shrink:0}
  .duo-notice .dn-title{font-size:13px;font-weight:700;color:#f0ab3c;margin-bottom:4px}
  .duo-notice p{font-size:12px;color:var(--text-dim);line-height:1.65}
  .btn-duo{background:#f0ab3c;border-color:#f0ab3c;color:#2a1c05}
  .btn-duo:hover{background:#f7bd5c;border-color:#f7bd5c}
  .badge-duo{background:rgba(240,171,60,0.14);color:#f0ab3c}
  .duo-group{border:1px solid #f0ab3c;border-radius:12px;padding:16px;margin-bottom:12px;background:rgba(240,171,60,0.05)}
  .duo-group .duo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .duo-group .duo-head .n{font-weight:600;font-size:14px}
  .duo-group .duo-head .t{font-size:12px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono)}
  .duo-group .duo-hint{font-size:11px;color:var(--text-faint);line-height:1.6;margin-bottom:12px}
  .duo-person{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:8px}
  .duo-person .pn{font-size:13px;font-weight:600}
  .duo-person .acts{display:flex;gap:6px;flex-wrap:wrap}

  .summary-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .summary-row:last-child{border-bottom:none}
  .summary-row .k{color:var(--text-dim)}
  .summary-row .v{font-weight:600;font-family:var(--font-mono)}

  .ring-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
  .ring{position:relative;width:168px;height:168px}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{transition:stroke-dashoffset .5s ease}
  .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-label .num{font-family:var(--font-display);font-size:40px;line-height:1}
  .ring-label .of{font-size:11px;color:var(--text-faint);margin-top:4px;letter-spacing:0.5px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:0.2px;white-space:nowrap}
  .badge-pending{background:rgba(240,171,60,0.14);color:#f0ab3c}
  .badge-confirmed{background:rgba(60,150,240,0.14);color:#5aa9f0}
  .badge-done{background:rgba(60,200,120,0.14);color:#4fd68a}
  .badge-noshow{background:var(--red-glow);color:#f0838f}
  .badge-rejected{background:var(--red-glow);color:#f0838f}
  .badge-cancelled{background:var(--surface-3);color:var(--text-faint)}
  .badge-active{background:rgba(60,200,120,0.14);color:#4fd68a}
  .badge-suspended{background:var(--red-glow);color:#f0838f}
  .badge-role{background:var(--surface-3);color:var(--text-dim)}

  .req-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface-2)}
  .req-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .req-top .n{font-weight:600;font-size:14px}
  .req-top .t{font-size:12px;color:var(--text-faint);margin-top:2px}
  .req-actions{display:flex;gap:8px}
  .req-actions .btn{flex:1;padding:9px 0;font-size:12px}

  .sched-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sched-row:last-child{border-bottom:none}
  .sched-row .time{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);width:52px;flex-shrink:0}
  .sched-row .who{flex:1;font-size:13px;font-weight:500;min-width:120px}
  .sched-row .acts{display:flex;gap:8px}

  .notif-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .notif-item:last-child{border-bottom:none}
  .notif-item.unread{background:rgba(224,41,63,0.04)}
  .notif-ico{width:34px;height:34px;border-radius:9px;background:var(--red-glow);color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:700}
  .notif-item .body{font-size:13px;line-height:1.5;flex:1}
  .notif-item .body .ttl{font-weight:600;margin-bottom:2px}
  .notif-item .when{font-size:11px;color:var(--text-faint);margin-top:2px}

  .empty{text-align:center;padding:40px 10px;color:var(--text-faint);font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--line-strong);color:var(--text);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:50;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-right:9px}

  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat-card .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px}
  .stat-card .val{font-family:var(--font-display);font-size:30px;margin-top:8px}
  .stat-card .val.accent{color:var(--red)}

  .cert-chip{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:8px}
  .cert-chip .ic{width:30px;height:30px;border-radius:8px;background:var(--red-glow);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .cert-chip .info{flex:1;min-width:0}
  .cert-chip .info .n{font-size:13px;font-weight:600}
  .cert-chip .info .s{font-size:11px;color:var(--text-faint)}
  .cert-badge-row{display:flex;flex-wrap:wrap;gap:8px}
  .cert-badge{font-size:11px;padding:6px 12px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-strong);color:var(--text-dim)}

  .table{width:100%;border-collapse:collapse}
  .table th{text-align:left;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.6px;padding:0 10px 10px;border-bottom:1px solid var(--line)}
  .table td{padding:12px 10px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table input,.table select{padding:8px 10px;font-size:12px}
  .table-wrap{overflow-x:auto}

  .profile-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .profile-header .avatar{width:60px;height:60px;font-size:20px}
  .profile-header .n{font-family:var(--font-display);font-size:20px}
  .profile-header .s{font-size:12px;color:var(--text-faint)}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-bottom:14px;cursor:pointer}
  .back-link:hover{color:var(--text)}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal-overlay.show{display:flex}
  .modal-box{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:42px 32px;text-align:center;max-width:380px;width:100%;animation:popIn .3s ease}
  @keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .modal-icon{width:64px;height:64px;border-radius:50%;background:var(--red-glow);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;animation:pulse 1.5s ease-in-out infinite}
  .modal-box h2{font-family:var(--font-display);font-size:26px;margin-bottom:10px;letter-spacing:.3px}
  .modal-box p{color:var(--text-dim);font-size:14px;margin-bottom:24px;line-height:1.6}

  .auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:30px 10px}
  .auth-box{max-width:420px;width:100%;animation:fadeSlide .3s ease}
  .auth-mark{width:52px;height:52px;border-radius:13px;background:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
  .auth-hint{font-size:11px;color:var(--text-faint);text-align:center;margin-top:14px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .quick-login-label{font-size:11px;color:var(--text-faint);text-align:center;margin-top:18px;margin-bottom:10px;letter-spacing:0.3px}
  .quick-login-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
  .quick-login-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);color:var(--text);font-family:var(--font-body)}
  .quick-login-row:hover{background:var(--surface-3);border-color:var(--red-dim)}
  .quick-login-row .qn{font-size:13px;font-weight:600;flex:1;min-width:0}
  .quick-login-row .qc{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);flex-shrink:0}
  .auth-switch{text-align:center;font-size:12px;color:var(--text-dim);margin-top:18px}
  .auth-switch a{color:var(--red);font-weight:600;cursor:pointer}
  .auth-back{text-align:center;font-size:12px;color:var(--text-dim);margin-top:16px;display:block;cursor:pointer}
  .auth-error{background:var(--red-glow);color:#f0838f;font-size:12px;padding:10px 12px;border-radius:9px;margin-bottom:14px}

  .role-tab{display:flex;border:1px solid var(--line-strong);border-radius:99px;padding:3px;gap:2px;margin:0 auto 24px;width:fit-content}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;position:relative;font-size:14px;font-weight:600;flex-shrink:0;padding:0}
  .icon-btn:hover{background:var(--surface-3)}
  .icon-btn .badge-dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
  .role-tab button{border:none;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;padding:8px 16px;border-radius:99px;letter-spacing:0.3px;white-space:nowrap}
  .role-tab button.active{background:var(--red);color:#fff}

  .loading-shell{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px}
  .pkg-buy-row{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface-2);flex-wrap:wrap;gap:10px}
  .pkg-buy-row .info .n{font-weight:600;font-size:14px}
  .pkg-buy-row .info .s{font-size:12px;color:var(--text-faint);margin-top:2px}
  .footer-note{font-size:11px;color:var(--text-faint);text-align:center;margin-top:30px;line-height:1.7}

  /* ---------------- responsive refinements ----------------
     Desktop keeps the layout above as-is (max-width:1180px shell).
     These queries progressively tighten spacing, type scale and
     touch targets down through tablet and phone widths so every
     view — auth, dashboards, booking, tables, modal — stays usable
     with one hand on a small screen. */
  @media(max-width:1024px){
    .shell{padding:0 18px}
  }
  @media(max-width:820px){
    .view{padding:28px 0 56px}
    .page-head h1{font-size:28px}
    .ring{width:148px;height:148px}
    .ring-label .num{font-size:34px}
  }
  @media(max-width:600px){
    .shell{padding:0 16px}
    .user-chip .role-pill{display:none}
    .topbar{padding:16px 0;gap:10px}
    .brand-mark{width:38px;height:38px;font-size:18px;border-radius:9px}
    .brand-text .name{font-size:16px}
    .wordmark{font-size:9px;padding:2px 6px}
    .top-controls{gap:8px}
    .nav{padding:12px 0}
    .nav button{padding:8px 12px;font-size:12.5px}
    .view{padding:22px 0 48px}
    .page-head{margin-bottom:20px}
    .page-head .eyebrow{font-size:10px}
    .page-head h1{font-size:24px}
    .page-head p{font-size:13px}
    .card{padding:16px;border-radius:12px;margin-bottom:14px}
    .card-head h3{font-size:14px}
    .stat-card{padding:14px}
    .stat-card .val{font-size:24px}
    .modal-box{padding:30px 20px;border-radius:14px}
    .modal-icon{width:54px;height:54px;font-size:24px}
    .modal-box h2{font-size:21px}
    .auth-wrap{padding:16px 6px;min-height:unset}
    .auth-mark{width:46px;height:46px;font-size:19px}
    .profile-header .avatar{width:50px;height:50px;font-size:17px}
    .day-pill{width:56px}
    .table th,.table td{padding:10px 8px;font-size:12.5px}
    .btn{padding:11px 16px}
  }
  @media(max-width:380px){
    .shell{padding:0 12px}
    .page-head h1{font-size:21px}
    .lang-toggle button{padding:6px 9px;font-size:10px}
    .icon-btn{width:36px;height:36px;font-size:13px}
    .user-chip{padding:5px 6px 5px 11px;font-size:11px}
    .cat-pill{flex-basis:100%}
    .day-pill{width:52px}
  }
  /* every direct tap target keeps a comfortable minimum hit area
     on touch devices, regardless of viewport width */
  @media(hover:none) and (pointer:coarse){
    .btn,.nav button,.day-pill,.time-slot,.cat-pill,.role-tab button,.lang-toggle button{min-height:40px}
    .icon-btn{width:40px;height:40px}
  }

  /* ---------------- phone/tablet tap targets & table reflow ----------------
     Width-based (not pointer-based) so the sizes hold on touch laptops and
     in any browser that doesn't report a coarse pointer. */
  @media(max-width:768px){
    .btn,.nav button,.day-pill,.time-slot,.cat-pill,.role-tab button{min-height:42px}
    .user-chip button{min-height:38px;padding:9px 14px}
    .icon-btn{width:42px;height:42px}
    .lang-toggle button{min-height:38px;padding:9px 14px}
    /* trim the chrome so the user chip, language switch and icons fit on
       one comfortable row instead of stacking into three */
    .user-chip .signed-label{display:none}
    .user-chip{padding:5px 6px 5px 12px;gap:7px;min-width:0}
    .user-chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
    /* keep the two round icon buttons together instead of letting the bell
       get pushed onto a line of its own */
    #profileIconBtn{order:1}
    #notifIconBtn{order:2}
    #userChip{order:3}
    #langToggle{order:4}
    .device-toggle-btn{width:46px;height:46px;font-size:19px;right:14px;bottom:14px}
    /* inline text links in the auth screen were only ~19px tall to tap */
    .auth-back,.auth-switch a{display:inline-block;padding:11px 6px;min-height:42px;line-height:20px}
    .inp-num{width:100%}

    /* Data tables don't fit a phone, so each row becomes its own card with
       the column header shown inline as a label. No sideways scrolling. */
    .table-wrap{overflow:visible}
    .table,.table tbody,.table tr,.table td{display:block;width:100%}
    .table thead{display:none}
    .table tr{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;margin-bottom:10px}
    .table td{border:none;padding:7px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right}
    .table td::before{content:attr(data-label);font-size:11px;color:var(--text-faint);font-weight:600;text-align:left;flex-shrink:0;letter-spacing:0.3px}
    .table td:not([data-label]){justify-content:stretch}
    .table td.td-actions{padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
    .table td.td-actions .btn{width:100%}
    .table td input,.table td select{max-width:60%}
  }
  @media(max-width:420px){
    .table td{flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:4px}
    .table td input,.table td select{max-width:100%}
  }

  /* ---------------- device preview toggle ----------------
     Floating button (bottom-right on every screen) that opens a
     framed live preview of this same page rendered at a mobile
     phone width — or, if you're already viewing on a narrow
     screen, at a desktop width — so the mobile and desktop
     layouts can be checked without resizing the real window. */
  .device-toggle-btn{position:fixed;right:20px;bottom:20px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -6px rgba(224,41,63,0.65)}
  .device-toggle-btn:hover{background:#f13650}
  .device-frame-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:160;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .device-frame-overlay.show{display:flex}
  .device-frame-topbar{display:flex;align-items:center;gap:16px;color:var(--text-dim);font-size:12px;font-weight:600;letter-spacing:0.3px}
  .device-frame-topbar button{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600}
  .device-frame-topbar button:hover{background:var(--surface-3)}
  .device-frame-shell{border-radius:30px;border:8px solid #131010;background:#000;box-shadow:0 24px 70px rgba(0,0,0,0.6);overflow:hidden;max-width:94vw;max-height:80vh}
  .device-frame-shell iframe{display:block;width:100%;height:100%;border:none;background:var(--bg)}
</style>
</head>

function t(key){ return (i18n[lang] && i18n[lang][key]) || key; }
function tt(key, params){ return t(key).replace(/\{(\w+)\}/g, (m,k)=> (params && params[k]!==undefined) ? params[k] : m); }

/* ---------------- storage / "database" layer ----------------
   All app data lives in shared window.storage so the Customer, Trainer
   and Admin systems (and different browser sessions) read/write the
   exact same records. */
/* Storage adapter: use the shared host storage when available,
   otherwise fall back to localStorage so the Beta demo also works
   when opened directly or previewed without window.storage. */
const localDbPrefix = 'hug-yim-plus-fitness:';

/* ---------------- in-memory cache ----------------
   Every dbGet/dbSet/dbDelete/dbGetAll call in the file keeps the exact
   same signature and return shape — this cache sits transparently
   underneath them, so no call site anywhere else needs to change.
   - keyCache: single-record cache (key -> parsed value)
   - listCache: resolved-collection cache (prefix -> array of values)
   Writes/deletes still go through to window.storage/localStorage exactly
   as before; the cache is just updated/invalidated alongside them so
   nothing ever goes stale. */
const keyCache = new Map();
const listCache = new Map();
function invalidateListsFor(key){
  for(const prefix of listCache.keys()){
    if(key.startsWith(prefix)) listCache.delete(prefix);
  }
}
/* The cache above is only ever safe to reuse WITHIN a single render pass on
   THIS tab. It has no way to know when a *different* browser tab/session —
   a customer booking on their phone while a trainer has the requests page
   open on a laptop, say — writes new data to the shared storage. Left
   uncleared, a tab that already cached a prefix would keep showing that
   snapshot forever and never notice new bookings, approvals, etc. from
   anyone else, no matter how many times the person clicks around.
   So every render cycle (renderRoot for a full navigation, renderView for
   everything else, including direct calls after a mutation and purely
   local UI updates) starts by wiping both caches — guaranteeing each
   render reflects the current shared data — while calls still made
   *within* that same pass keep the short-lived speed benefit. */
function clearRenderCaches(){ keyCache.clear(); listCache.clear(); }

/* If window.storage fails once (e.g. this host's preview returns a response
   shape the app doesn't recognize), remember that and skip trying it again
   for the rest of the session — go straight to the fast localStorage path
   instead of re-attempting (and re-failing) on every single call.
   A single memoized probe (rather than a plain boolean flag) means that
   even when several dbGet/dbSet/dbList calls fire in parallel at boot
   (e.g. inside Promise.all), they all await the *same* one-time check
   instead of each independently hitting — and separately failing/warning
   about — the shared storage backend. */
let sharedStorageBroken = false;
let storageProbePromise = null;
function storageIsAvailable(){
  if(sharedStorageBroken) return Promise.resolve(false);
  if(!storageProbePromise){
    storageProbePromise = (async ()=>{
      if(!(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function')) return false;
      try{
        await window.storage.set('__hy_probe__', '1', true);
        return true;
      }catch(e){
        sharedStorageBroken = true;
        return false;
      }
    })();
  }
  return storageProbePromise;
}

async function dbGet(key){
  if(keyCache.has(key)) return keyCache.get(key);
  let val = null;
  if(await storageIsAvailable()){
    try{
      const r = await window.storage.get(key, true);
      val = r ? JSON.parse(r.value) : null;
      keyCache.set(key, val);
      return val;
    }catch(e){ /* key not found or a one-off read error — fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(localDbPrefix + key);
    val = raw ? JSON.parse(raw) : null;
  }catch(e){ val = null; }
  keyCache.set(key, val);
  return val;
}

async function dbSet(key, val){
  keyCache.set(key, val);
  invalidateListsFor(key);
  if(await storageIsAvailable()){
    try{
      const result = await window.storage.set(key, JSON.stringify(val), true);
      if(result) return result;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    localStorage.setItem(localDbPrefix + key, JSON.stringify(val));
    return {ok:true};
  }catch(e){
    console.error('localStorage set failed', key, e);
    return null;
  }
}

async function dbDelete(key){
  keyCache.delete(key);
  invalidateListsFor(key);
  if(await storageIsAvailable()){
    try{
      await window.storage.delete(key, true);
    }catch(e){ /* ignore — already gone or a one-off error */ }
  }
  try{ localStorage.removeItem(localDbPrefix + key); }catch(e){}
}

async function dbList(prefix){
  if(await storageIsAvailable()){
    try{
      const r = await window.storage.list(prefix, true);
      if(r && Array.isArray(r.keys)) return r.keys;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(localDbPrefix + prefix)){
        keys.push(k.slice(localDbPrefix.length));
      }
    }
    return keys;
  }catch(e){ return []; }
}
async function dbGetAll(prefix){
  if(listCache.has(prefix)) return listCache.get(prefix).slice();
  const keys = await dbList(prefix);
  const vals = await Promise.all(keys.map(k=>dbGet(k)));
  const result = vals.filter(Boolean);
  listCache.set(prefix, result);
  return result.slice();
}

function toast(msg){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(-1)[0].slice(0,1).toUpperCase(); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  const days_th=['อา','จ','อ','พ','พฤ','ศ','ส'], months_th=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  if(lang==='th') return days_th[d.getDay()]+'. '+d.getDate()+' '+months_th[d.getMonth()];
  return d.toLocaleDateString('en-US',{weekday:'short', day:'numeric', month:'short'});
}
function fmtTime(time){
  if(!time) return '—';
  if(lang==='th') return time+' น.';
  let [h,m] = time.split(':').map(Number);
  const period = h<12?'AM':'PM'; let h12=h%12; if(h12===0)h12=12;
  return h12+':'+String(m).padStart(2,'0')+' '+period;
}
function badgeFor(status){
  const map = {pending:'badge-pending', confirmed:'badge-confirmed', completed:'badge-done', no_show:'badge-noshow', rejected:'badge-rejected', cancelled:'badge-cancelled'};

  return `<span class="badge ${map[status]||'badge-role'}">${label[status]||status}</span>`;
}

async function getActivePackage(customerId){
  const pkgs = await dbGetAll('custpkg:');
  const today = new Date().toISOString().slice(0,10);
  // A package must still be within its expiry window to actually be usable —
  // remainingSessions>0 alone isn't enough, otherwise a customer could keep
  // booking indefinitely on a package that expired months ago.
  const mine = pkgs.filter(p=>p.customerId===customerId && p.status==='active' && p.remainingSessions>0 && p.expiryDate>=today);
  mine.sort((a,b)=> new Date(a.expiryDate)-new Date(b.expiryDate));
  return mine[0] || null;
}
/* True when the customer has at least one package that ran out purely
   because its expiry date passed — used to show a specific "expired,
   please renew" message instead of the generic "no package" one. */
async function hasExpiredUnusedPackage(customerId){
  const pkgs = await dbGetAll('custpkg:');
  const today = new Date().toISOString().slice(0,10);
  return pkgs.some(p=>p.customerId===customerId && p.status==='active' && p.remainingSessions>0 && p.expiryDate<today);
}
async function getAllMyPackages(customerId){

async function getApprovedTrainers(){

  return all.filter(x=>x.status==='active');
}
async function getPinnedTrainerIds(){
  const c = await dbGet('customer:'+session.id);
  return (c && c.pinnedTrainerIds) || [];
}
/* Pinned trainers float to the top, most-recently-pinned first; everyone
   else keeps whatever order they were already in. This is per-customer
   (stored on the customer record) so it never affects what other
   customers or the trainer/admin systems see. */
function sortTrainersByPin(trainers, pinnedIds){
  if(!pinnedIds || !pinnedIds.length) return trainers;
  const rank = new Map(pinnedIds.map((id,i)=>[id,i]));
  return [...trainers].sort((a,b)=>{
    const ra = rank.has(a.id) ? rank.get(a.id) : Infinity;
    const rb = rank.has(b.id) ? rank.get(b.id) : Infinity;
    return ra - rb;
  });
}
async function togglePinTrainer(id){
  const c = await dbGet('customer:'+session.id);
  if(!c) return;
  c.pinnedTrainerIds = c.pinnedTrainerIds || [];
  const trainer = await dbGet('trainer:'+id);
  const idx = c.pinnedTrainerIds.indexOf(id);
  if(idx >= 0){
    c.pinnedTrainerIds.splice(idx,1);
    toast(tt('tr_unpinned_toast',{name: trainer?trainer.name:''}));
  } else {
    c.pinnedTrainerIds.unshift(id);
    toast(tt('tr_pinned_toast',{name: trainer?trainer.name:''}));
  }
  await dbSet('customer:'+c.id, c);
  renderView();
}

const DAYS = (()=>{ const arr=[]; const start=new Date(); for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); arr.push(d.toISOString().slice(0,10)); } return arr; })();
const TIMES = { morning:['06:00','07:00','08:00','09:00','10:00','11:00'], afternoon:['13:00','14:00','15:00','16:00'], evening:['17:00','18:00','19:00','20:00'] };
let bookingState = { trainerId:null, day:DAYS[0], cat:'morning', time:null };

/* ======================================================================
   DUO BOOKING (ระบบจองคู่)
   A slot can hold up to DUO_CAPACITY (2) customers, but only while the
   requests are still pending. The trainer is the one who decides:
     - accept both  -> pair session (sessionMode 'duo'), slot now full
     - accept one   -> solo session, slot LOCKED and every other pending
                       request at that exact slot is auto-declined so the
                       other customer is bounced out to pick a new time
   Therefore, for new bookings a slot is:
     - locked   : any confirmed booking exists there (solo lock or duo full)
     - full     : already has DUO_CAPACITY pending requests
     - duo-open : exactly 1 pending request — still bookable as a pair ask
   ====================================================================== */
const DUO_CAPACITY = 2;
const ACTIVE_BOOKING_STATUSES = ['pending','confirmed'];

function bookingsAtSlot(all, trainerId, date, time){
  return all.filter(b=> b.trainerId===trainerId && b.bookingDate===date && b.bookingTime===time && ACTIVE_BOOKING_STATUSES.includes(b.status));
}
/* Returns why (if at all) a customer cannot book this slot. */
function slotAvailability(all, trainerId, date, time, customerId){
  const at = bookingsAtSlot(all, trainerId, date, time);
  const confirmed = at.filter(b=>b.status==='confirmed');
  const pending = at.filter(b=>b.status==='pending');
  if(customerId && at.some(b=>b.customerId===customerId)) return {ok:false, reason:'already_mine', pending:pending.length};
  if(confirmed.length) return {ok:false, reason:'locked', pending:pending.length};
  if(pending.length >= DUO_CAPACITY) return {ok:false, reason:'full', pending:pending.length};
  return {ok:true, reason:null, pending:pending.length};
}

/* Bookings store a snapshot of the customer's and trainer's names so each
   list can render without extra lookups. When someone renames themselves
   those snapshots would go stale and the other side would keep seeing the
   old name forever — so push the new name through every affected booking
   (and through any pair-session partner lists that mention it). */
async function propagateNameChange(role, id, newName){
  const bookings = await dbGetAll('booking:');
  let touchedCustomer = false;
  for(const b of bookings){
    let changed = false;
    if(role==='customer' && b.customerId===id && b.customerName!==newName){ b.customerName = newName; changed = true; touchedCustomer = true; }
    if(role==='trainer'  && b.trainerId===id  && b.trainerName!==newName){ b.trainerName  = newName; changed = true; }
    if(changed) await dbSet('booking:'+b.id, b);
  }
  if(touchedCustomer){
    const fresh = await dbGetAll('booking:');
    for(const b of fresh){
      if(b.sessionMode !== 'duo') continue;
      const names = fresh
        .filter(x=> x.id!==b.id && x.trainerId===b.trainerId && x.bookingDate===b.bookingDate && x.bookingTime===b.bookingTime && x.sessionMode==='duo')
        .map(x=> x.customerName);
      if(JSON.stringify(names) !== JSON.stringify(b.partnerNames||[])){
        b.partnerNames = names;
        await dbSet('booking:'+b.id, b);
      }
    }
  }
}

  const newPhone = document.getElementById('cProfPhone').value.trim() || c.phone;
  // A phone number is a login ID here, so it has to stay unique — otherwise
  // two accounts answer to the same credentials and login becomes ambiguous.
  if(newPhone !== c.phone){
    const others = (await dbGetAll('customer:')).filter(x=> x.id !== c.id);
    if(others.some(x=> x.phone===newPhone || x.username===newPhone)){
      toast(t('auth_toast_phone_used'));

    }
  }
  c.name = newName;

  await dbSet('customer:'+c.id, c);
  await propagateNameChange('customer', c.id, c.name);
  session.name = c.name;
  toast(t('prof_saved'));
  renderRoot();
}

/* Accept a single request as a SOLO session: the slot is locked and every
   other pending request at that exact slot is bounced out automatically. */
async function respondBooking(id, accept){
  const b = await dbGet('booking:'+id);
  if(!b || b.status!=='pending') return;
  b.status = accept ? 'confirmed' : 'rejected';
  if(accept){ b.sessionMode = 'solo'; b.partnerNames = []; }
  await dbSet('booking:'+id, b);
  if(accept){
    await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, b.id);
    // bounce out the other pending requests competing for this slot
    const all = await dbGetAll('booking:');
    const losers = all.filter(x=> x.id!==b.id && x.trainerId===b.trainerId && x.bookingDate===b.bookingDate && x.bookingTime===b.bookingTime && x.status==='pending');
    for(const l of losers){
      l.status = 'rejected';
      await dbSet('booking:'+l.id, l);
      await pushNotification(l.customerId, 'nav_c_booking', 'notif_slot_lost', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, l.id);
    }
    toast(losers.length ? t('duo_toast_solo') : t('tq_toast_accept'));
  } else {
    await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_rejected', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, b.id);
    toast(t('tq_toast_reject'));
  }
  renderView(); renderNav();
}

/* Accept every pending request at a slot together as a PAIR session. */
async function acceptDuo(slotKey){
  const [date, time] = slotKey.split('|');
  const all = await dbGetAll('booking:');
  const pending = all
    .filter(b=> b.trainerId===session.id && b.bookingDate===date && b.bookingTime===time && b.status==='pending')
    .sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
  if(!pending.length) return;

  const accepted = pending.slice(0, DUO_CAPACITY);
  const overflow = pending.slice(DUO_CAPACITY); // more than the pair can hold
  const names = accepted.map(b=>b.customerName);

  for(const b of accepted){
    b.status = 'confirmed';
    b.sessionMode = accepted.length > 1 ? 'duo' : 'solo';
    b.partnerNames = names.filter(n=> n!==b.customerName);
    await dbSet('booking:'+b.id, b);
    if(b.sessionMode === 'duo'){
      await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted_duo', {trainer:b.trainerName, date:fmtDate(date), time:fmtTime(time), partner:b.partnerNames.join(', ')}, b.id);
    } else {
      await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted', {trainer:b.trainerName, date:fmtDate(date), time:fmtTime(time)}, b.id);
    }
  }
  for(const l of overflow){
    l.status = 'rejected';
    await dbSet('booking:'+l.id, l);
    await pushNotification(l.customerId, 'nav_c_booking', 'notif_slot_lost', {trainer:l.trainerName, date:fmtDate(date), time:fmtTime(time)}, l.id);
  }
  toast(tt('duo_toast_both',{count:accepted.length}));
  renderView(); renderNav();
}

async function finishBooking(id, noShow){
  const b = await dbGet('booking:'+id);
  if(!b || b.status!=='confirmed') return; // guard against double-deduction
  b.status = noShow ? 'no_show' : 'completed';
  b.completedAt = new Date().toISOString();
  await dbSet('booking:'+id, b);

  // deduct exactly one session from the linked package instance
  if(b.packageInstanceId){
    const pkg = await dbGet('custpkg:'+b.packageInstanceId);
    if(pkg && pkg.remainingSessions>0){
      pkg.usedSessions += 1;
      pkg.remainingSessions -= 1;
      if(pkg.remainingSessions<=0) pkg.status = 'used_up';
      await dbSet('custpkg:'+pkg.id, pkg);
      await pushNotification(b.customerId, 'nav_c_package', noShow?'notif_noshow':'notif_done', {who:b.trainerName, count:pkg.remainingSessions}, b.id);
      if(pkg.remainingSessions<=0) await pushNotification(b.customerId, 'nav_c_package', 'notif_full', {}, b.id);
    }
  }
  toast(noShow? t('ts_toast_noshow') : t('ts_toast_done'));
  renderView();
}

async function saveTrainerProfile(){
  const tr = await dbGet('trainer:'+session.id);
  const newName = document.getElementById('pfName').value.trim() || tr.name;
  const newPhone = document.getElementById('pfPhone').value.trim();
  // Same uniqueness rule as customers: the phone doubles as the login ID,
  // and a pending application must not be able to squat an existing one.
  if(newPhone && newPhone !== tr.phone){
    const [trainers, apps] = await Promise.all([dbGetAll('trainer:'), dbGetAll('trainerApp:')]);
    const clash = trainers.some(x=> x.id!==tr.id && (x.phone===newPhone || x.username===newPhone))
               || apps.some(x=> x.username===newPhone || x.phone===newPhone);
    if(clash){ toast(t('auth_toast_phone_used')); return; }
  }
  tr.name = newName;
  tr.specialty = document.getElementById('pfSpecialty').value.trim();
  if(newPhone){ tr.phone = newPhone; tr.username = newPhone; }
  tr.bio = document.getElementById('pfBio').value.trim();
  tr.ready = document.getElementById('pfReady').checked;
  await dbSet('trainer:'+tr.id, tr);
  await propagateNameChange('trainer', tr.id, tr.name);
  session.name = tr.name;
  toast(t('tpz_toast_saved'));
  renderRoot();
}
async function addCert(){
  const name = document.getElementById('newCertName').value.trim();
  if(!name){ toast(t('tpz_toast_need_name')); return; }
  const issuer = document.getElementById('newCertIssuer').value.trim();
  const year = document.getElementById('newCertYear').value.trim();
  const tr = await dbGet('trainer:'+session.id);
  tr.certs = tr.certs || [];
  tr.certs.push({name, issuer, year});
  await dbSet('trainer:'+tr.id, tr);
  toast(t('tpz_toast_cert_added'));
  // Refresh only the certificates card — a full renderView() would rebuild
  // the personal-info fields from the database and discard any unsaved
  // edits the trainer made to name/specialty/phone/bio before saving.
  await refreshCertsCard();
}
async function removeCert(idx){
  const tr = await dbGet('trainer:'+session.id);
  tr.certs.splice(idx,1);
  await dbSet('trainer:'+tr.id, tr);
  toast(t('tpz_toast_cert_removed'));
  await refreshCertsCard();
}

      </div>
      <button class="btn btn-primary btn-block" id="applyBtn">${t('auth_apply_submit')}</button>
      <a class="auth-back" id="backToLogin2">← ${t('auth_back_to_login')}</a>
    `;
  }

  app.innerHTML = `
    <div class="view">
      <div class="role-tab" id="authRoleTab">
        <button data-role="customer" class="${authRole==='customer'?'active':''}">${t('role_customer')}</button>
        <button data-role="trainer" class="${authRole==='trainer'?'active':''}">${t('role_trainer')}</button>
        <button data-role="admin" class="${authRole==='admin'?'active':''}">${t('role_admin')}</button>
      </div>
      <div class="auth-wrap" style="min-height:auto;padding-top:0"><div class="auth-box card">${inner}</div></div>
      <div class="footer-note">${t('footer_note')}</div>
    </div>
  `;

  document.querySelectorAll('#authRoleTab button').forEach(b=>b.addEventListener('click', ()=>{
    authRole = b.dataset.role; authMode='login'; authError=''; renderAuth();
  }));
  const toReg = document.getElementById('toRegister'); if(toReg) toReg.addEventListener('click', ()=>{ authMode='register'; authError=''; regDraft={name:'',phone:'',pw:''}; renderAuth(); });
  const toApp = document.getElementById('toApply'); if(toApp) toApp.addEventListener('click', ()=>{ authMode='apply'; authError=''; pendingApplicationCerts=[]; applyDraft={name:'',specialty:'',phone:'',pw:'',bio:''}; renderAuth(); });
  const back1 = document.getElementById('backToLogin'); if(back1) back1.addEventListener('click', ()=>{ authMode='login'; authError=''; renderAuth(); });
  const back2 = document.getElementById('backToLogin2'); if(back2) back2.addEventListener('click', ()=>{ authMode='login'; authError=''; renderAuth(); });
  const loginBtn = document.getElementById('loginBtn'); if(loginBtn) loginBtn.addEventListener('click', doLogin);
  document.querySelectorAll('.quick-login-row').forEach(row=>row.addEventListener('click', ()=>{
    const idEl = document.getElementById('authId'), pwEl = document.getElementById('authPw');
    if(idEl) idEl.value = row.dataset.qid;
    if(pwEl) pwEl.value = row.dataset.qpw;
    doLogin();
  }));
  const regBtn = document.getElementById('registerBtn'); if(regBtn) regBtn.addEventListener('click', doRegister);
  const applyBtn = document.getElementById('applyBtn'); if(applyBtn) applyBtn.addEventListener('click', doApply);
  const regName = document.getElementById('regName'); if(regName) regName.addEventListener('input', ()=> regDraft.name = regName.value);
  const regPhone = document.getElementById('regPhone'); if(regPhone) regPhone.addEventListener('input', ()=> regDraft.phone = regPhone.value);
  const regPw = document.getElementById('regPw'); if(regPw) regPw.addEventListener('input', ()=> regDraft.pw = regPw.value);
  const apNameEl = document.getElementById('apName'); if(apNameEl) apNameEl.addEventListener('input', ()=> applyDraft.name = apNameEl.value);
  const apSpecialtyEl = document.getElementById('apSpecialty'); if(apSpecialtyEl) apSpecialtyEl.addEventListener('input', ()=> applyDraft.specialty = apSpecialtyEl.value);
  const apPhoneEl = document.getElementById('apPhone'); if(apPhoneEl) apPhoneEl.addEventListener('input', ()=> applyDraft.phone = apPhoneEl.value);
  const apPwEl = document.getElementById('apPw'); if(apPwEl) apPwEl.addEventListener('input', ()=> applyDraft.pw = apPwEl.value);
  const apBioEl = document.getElementById('apBio'); if(apBioEl) apBioEl.addEventListener('input', ()=> applyDraft.bio = apBioEl.value);
  const addCertBtn = document.getElementById('apAddCertBtn'); if(addCertBtn) addCertBtn.addEventListener('click', ()=>{
    const nameEl = document.getElementById('apCertName');
    const issuerEl = document.getElementById('apCertIssuer');
    const yearEl = document.getElementById('apCertYear');
    const name = nameEl.value.trim();
    if(!name) return;
    pendingApplicationCerts.push({name, issuer:issuerEl.value.trim(), year:yearEl.value.trim()});
    // Update only the cert list in place (not a full renderAuth) so the rest of
    // the application form the applicant already filled in — name, specialty,
    // phone, password, bio — is never wiped out.
    nameEl.value=''; issuerEl.value=''; yearEl.value='';
    const listEl = document.getElementById('apCertList');
    if(listEl) listEl.innerHTML = pendingApplicationCerts.map(c=>`<span class="cert-badge" style="margin-right:6px">${esc(c.name)}</span>`).join('');
  });
}

async function doLogin(){
  const id = (document.getElementById('authId').value||'').trim();
  const pw = (document.getElementById('authPw').value||'').trim();
  if(!id || !pw){ authError = t('auth_toast_fill'); renderAuth(); return; }

  /* Demo credentials are intentionally kept as a fallback for the
     trainer/customer quick-login buttons only, so a missing/empty storage
     layer never incorrectly reports those valid demo logins as invalid.
     Admin is deliberately NOT included here: its username and password are
     private, live only in the admin:admin record, and must never be
     hardcoded anywhere reachable from the client. */
  const demoAccounts = {
    trainer: {id:'0833333333', pw:'1234', role:'trainer', name:'โค้ชเต้', accountId:'t3'},
    customer:{id:'0911111111', pw:'1234', role:'customer', name:'เป้', accountId:'c1'}
  };
  const demo = demoAccounts[authRole];
  const normalizedId = id.replace(/\s+/g,'');
  if(demo && normalizedId === demo.id && pw === demo.pw){
    session = {
      id: demo.accountId || 'admin',
      role: demo.role,
      name: demo.name
    };
    authError='';
    route='dashboard';
    renderRoot();
    return;
  }

  if(authRole==='admin'){
    const admin = await dbGet('admin:admin');
    if(admin && admin.username===id && admin.password===pw){
      session = {id:'admin', role:'admin', name:admin.name};
      authError=''; route='dashboard'; renderRoot(); return;
    }
    authError = t('auth_toast_wrong'); renderAuth(); return;
  }

  if(authRole==='trainer'){
    const trainers = await dbGetAll('trainer:');
    const tr = trainers.find(x=> (x.username===id || x.phone===id) && x.password===pw);
    if(tr){
      if(tr.status!=='active'){ authError = t('auth_toast_suspended'); renderAuth(); return; }
      session = {id:tr.id, role:'trainer', name:tr.name};
      authError=''; route='dashboard'; renderRoot(); return;
    }
    const apps = await dbGetAll('trainerApp:');
    const pendingApp = apps.find(x=> x.username===id && x.password===pw);
    if(pendingApp){ authError = t('auth_toast_pending'); renderAuth(); return; }
    authError = t('auth_toast_wrong'); renderAuth(); return;
  }

  // customer
  const customers = await dbGetAll('customer:');
  const c = customers.find(x=> (x.username===id || x.phone===id) && x.password===pw);
  if(c){
    if(c.status!=='active'){ authError = t('auth_toast_suspended'); renderAuth(); return; }
    session = {id:c.id, role:'customer', name:c.name};
    authError=''; route='dashboard'; renderRoot(); return;
  }
  authError = t('auth_toast_wrong'); renderAuth();
}

async function doRegister(){
  const name = (document.getElementById('regName').value||'').trim();
  const phone = (document.getElementById('regPhone').value||'').trim();
  const pw = (document.getElementById('regPw').value||'').trim();
  if(!name || !phone || !pw){ authError = t('auth_toast_fill'); renderAuth(); return; }
  const customers = await dbGetAll('customer:');
  if(customers.some(x=>x.phone===phone || x.username===phone)){ authError = t('auth_toast_phone_used'); renderAuth(); return; }
  const c = {id:newId('c'), username:phone, password:pw, name, phone, status:'active', role:'customer'};
  await dbSet('customer:'+c.id, c);
  session = {id:c.id, role:'customer', name:c.name};
  regDraft = {name:'', phone:'', pw:''};
  toast(t('auth_toast_registered'));
  authError=''; route='dashboard'; renderRoot();
}

async function doApply(){
  const name = (document.getElementById('apName').value||'').trim();
  const specialty = (document.getElementById('apSpecialty').value||'').trim();
  const phone = (document.getElementById('apPhone').value||'').trim();
  const pw = (document.getElementById('apPw').value||'').trim();
  const bio = (document.getElementById('apBio').value||'').trim();
  if(!name || !phone || !pw){ authError = t('auth_toast_fill'); renderAuth(); return; }
  const [trainers, apps] = await Promise.all([dbGetAll('trainer:'), dbGetAll('trainerApp:')]);
  if(trainers.some(x=>x.phone===phone||x.username===phone) || apps.some(x=>x.username===phone)){ authError = t('auth_toast_phone_used'); renderAuth(); return; }
  const app = {id:newId('app'), username:phone, password:pw, name, phone, specialty, bio, certs:pendingApplicationCerts, submittedAt:new Date().toISOString(), status:'pending'};
  await dbSet('trainerApp:'+app.id, app);
  pendingApplicationCerts = [];
  applyDraft = {name:'', specialty:'', phone:'', pw:'', bio:''};
  toast(t('auth_toast_applied'));
  authMode='login'; authError=''; renderAuth();
}

/* ======================================================================
   WIRE EVENTS for the currently rendered view (delegated via re-query)
   ====================================================================== */
function wireView(){
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=> go(el.dataset.goto)));
  document.querySelectorAll('[data-view-trainer]').forEach(el=>el.addEventListener('click', ()=> go('trainerProfile', {id:el.dataset.viewTrainer})));
  document.querySelectorAll('[data-book-trainer]').forEach(el=>el.addEventListener('click', ()=> go('booking', {trainerId:el.dataset.bookTrainer})));
  document.querySelectorAll('[data-pin-trainer]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); togglePinTrainer(el.dataset.pinTrainer); }));

  const searchBtn = document.getElementById('trainerSearchBtn');
  if(searchBtn) searchBtn.addEventListener('click', ()=> go('trainers', {q:document.getElementById('trainerSearch').value}));
  const searchInput = document.getElementById('trainerSearch');
  if(searchInput) searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') go('trainers', {q:searchInput.value}); });

  const trainerSelect = document.getElementById('bookTrainerSelect');
  if(trainerSelect) trainerSelect.addEventListener('change', ()=>{ bookingState.trainerId = trainerSelect.value || null; bookingState.time=null; renderView(); });
  document.querySelectorAll('#dayStrip .day-pill').forEach(el=>el.addEventListener('click', ()=>{ bookingState.day = el.dataset.day; bookingState.time=null; renderView(); }));
  document.querySelectorAll('.cat-pill[data-cat]').forEach(el=>el.addEventListener('click', ()=>{ bookingState.cat = el.dataset.cat; bookingState.time=null; renderView(); }));
  document.querySelectorAll('.time-slot[data-time]').forEach(el=>el.addEventListener('click', ()=>{ if(el.classList.contains('taken'))return; bookingState.time = el.dataset.time; renderView(); }));
  const submitBookingBtn = document.getElementById('submitBookingBtn');
  if(submitBookingBtn) submitBookingBtn.addEventListener('click', submitBooking);

  document.querySelectorAll('[data-buy-pkg]').forEach(el=>el.addEventListener('click', ()=> buyPackage(el.dataset.buyPkg)));

  const cProfSave = document.getElementById('cProfSave'); if(cProfSave) cProfSave.addEventListener('click', saveCProfile);

  document.querySelectorAll('[data-accept-booking]').forEach(el=>el.addEventListener('click', ()=> respondBooking(el.dataset.acceptBooking, true)));
  document.querySelectorAll('[data-accept-duo]').forEach(el=>el.addEventListener('click', ()=> acceptDuo(el.dataset.acceptDuo)));
  document.querySelectorAll('[data-reject-booking]').forEach(el=>el.addEventListener('click', ()=> respondBooking(el.dataset.rejectBooking, false)));
  document.querySelectorAll('[data-complete-booking]').forEach(el=>el.addEventListener('click', ()=> finishBooking(el.dataset.completeBooking, false)));
  document.querySelectorAll('[data-noshow-booking]').forEach(el=>el.addEventListener('click', ()=> finishBooking(el.dataset.noshowBooking, true)));

  const pfSaveBtn = document.getElementById('pfSaveBtn'); if(pfSaveBtn) pfSaveBtn.addEventListener('click', saveTrainerProfile);
  const addCertBtn = document.getElementById('addCertBtn'); if(addCertBtn) addCertBtn.addEventListener('click', addCert);
  document.querySelectorAll('[data-remove-cert]').forEach(el=>el.addEventListener('click', ()=> removeCert(Number(el.dataset.removeCert))));

  document.querySelectorAll('[data-approve-app]').forEach(el=>el.addEventListener('click', ()=> approveApp(el.dataset.approveApp, true)));
  document.querySelectorAll('[data-reject-app]').forEach(el=>el.addEventListener('click', ()=> approveApp(el.dataset.rejectApp, false)));

  document.querySelectorAll('[data-suspend-user]').forEach(el=>el.addEventListener('click', ()=> setUserStatus(el.dataset.suspendUser, 'suspended')));
  document.querySelectorAll('[data-activate-user]').forEach(el=>el.addEventListener('click', ()=> setUserStatus(el.dataset.activateUser, 'active')));

  document.querySelectorAll('[data-pkg-field]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'blur';
    el.addEventListener(evt, ()=> savePackageField(el.dataset.pkgId, el.dataset.pkgField, el.value));
  });
  const addPkgBtn = document.getElementById('addPkgBtn'); if(addPkgBtn) addPkgBtn.addEventListener('click', addPackage);
  document.querySelectorAll('[data-remove-pkg]').forEach(el=>el.addEventListener('click', ()=> removePackage(el.dataset.removePkg)));
}

document.getElementById('modalCloseBtn').addEventListener('click', ()=>{
  document.getElementById('bookingModal').classList.remove('show');
  renderView();
});

/* ---------------- device preview toggle ----------------
   Opens the current page inside a phone- or desktop-sized frame
   so mobile and desktop layouts can both be checked from one
   window, without touching or resetting the live app above. */
(function initDevicePreview(){
  const btn = document.getElementById('devicePreviewBtn');
  const icon = document.getElementById('devicePreviewIcon');
  const overlay = document.getElementById('deviceFrameOverlay');
  const label = document.getElementById('deviceFrameLabel');
  const closeBtn = document.getElementById('deviceFrameClose');
  const shell = document.getElementById('deviceFrameShell');
  const iframe = document.getElementById('deviceFrameIframe');
  if(!btn || !overlay) return;

  // Inside the preview iframe itself, hide the toggle so the phone/
  // desktop frame can't be opened recursively from within its own copy.
  if(window.frameElement){ btn.style.display = 'none'; return; }

  function isNarrow(){ return window.innerWidth <= 820; }
  function syncIcon(){ icon.textContent = isNarrow() ? '🖥️' : '📱'; }
  syncIcon();
  window.addEventListener('resize', syncIcon);

  function openPreview(){
    const mobile = !isNarrow();
    if(mobile){
      shell.style.width = '390px';
      shell.style.height = '780px';
      label.textContent = 'Mobile preview (390px)';
    }else{
      shell.style.width = '1180px';
      shell.style.height = '760px';
      label.textContent = 'Desktop preview (1180px)';
    }
    iframe.srcdoc = '<!DOCTYPE html>' + document.documentElement.outerHTML;
    overlay.classList.add('show');
  }
  function closePreview(){
    overlay.classList.remove('show');
    iframe.srcdoc = 'about:blank';
  }
  btn.addEventListener('click', openPreview);
  closeBtn.addEventListener('click', closePreview);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closePreview(); });
})();

/* ---------------- boot ---------------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="loading-shell">Loading…</div>`;
  await seedIfNeeded();
  await renderRoot();
})();
</script>
