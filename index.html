  catch(e){ if(e instanceof ApiError && e.status!==401){ console.warn('notification not sent:', e.reason); return; } throw e; }
}
async function getNotifications(userId){
  const all = await dbGetAll('notif:');
  return all.filter(n=>n.userId===userId).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
}
async function unreadCount(userId){
  const all = await getNotifications(userId);
  return all.filter(n=>!n.isRead).length;
}
async function markAllRead(userId){
  const all = await getNotifications(userId);
  for(const n of all){ if(!n.isRead){ n.isRead = true; await dbSet('notif:'+n.id, n); } }
}

/* ---------------- phone pop-up notifications (Web Push) ----------------
   The person turns them on per device. The browser makes a subscription; the server keeps it for that person.
   When a new notification is saved, the database asks the "push-send" function to send it to those devices. */
const PUSH_FLAG = 'tk_push_on';        // ids of people who turned the pop-ups on in this browser
const PUSH_NUDGE = 'tk_push_nudge';    // ids of people who closed the banner on the home page
let pushCfg = {key:null, at:0, asked:0};
let pushSynced = {};
function pushList(k){ try{ const a = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function pushListHas(k, id){ return pushList(k).indexOf(id) >= 0; }
function pushListAdd(k, id){ try{ const a = pushList(k).filter(x=>x!==id); a.push(id); localStorage.setItem(k, JSON.stringify(a.slice(-20))); }catch(e){} }
function pushListDel(k, id){ try{ localStorage.setItem(k, JSON.stringify(pushList(k).filter(x=>x!==id))); }catch(e){} }
function pushIsIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pushStandalone(){ try{ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){ return false; } }
function pushCanUse(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function pushKeyBytes(s){
  const p = String(s).replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - String(s).length % 4) % 4);
  const bin = atob(p); const o = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  return o;
}
function pushSameKey(a, b){ if(!a || !b || a.length !== b.length) return false; for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return false; return true; }
function pushDeviceLabel(){
  const ua = navigator.userAgent || '';
  const os = /Android/.test(ua) ? 'Android' : /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
  const br = /OPR\//.test(ua) ? 'Opera' : /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return (os + ' ' + br).trim();
}
/* The public key the browser needs. null while the server side is not ready (nothing is shown then). */
async function pushServerKey(){
  const now = Date.now();
  if(pushCfg.at && now - pushCfg.at < 7200000) return pushCfg.key;       // asked at most every 2 hours (and again after a reload)
  pushCfg.at = now;
  try{
    const r = await rpc('app_push_config', {p_token:authToken}, {retries:0});
    pushCfg.key = (r && r.publicKey) || null;
    if(!pushCfg.key && !pushCfg.asked){ pushCfg.asked = now; rpc('app_push_wake', {p_token:authToken}, {retries:0}).catch(()=>{}); }   // once per page load
  }catch(e){ pushCfg.key = null; }
  return pushCfg.key;
}
let pushRegMemo = null;
let pushLastErr = '';      // why the last "turn on" failed (shown under the button)
function pushFail(code){ pushLastErr = String(code || 'unknown').slice(0, 120); console.warn('push enable failed:', pushLastErr); return 'fail'; }
async function pushRegistration(){
  if(pushRegMemo) return pushRegMemo;
  if(!('serviceWorker' in navigator)) return null;
  try{
    const r = await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null), 6000))]);
    if(r) pushRegMemo = r;
    return r;
  }catch(e){ return null; }
}
async function pushCurrentSub(){
  const reg = await pushRegistration();
  if(!reg || !reg.pushManager) return null;
  try{ return await reg.pushManager.getSubscription(); }catch(e){ return null; }
}
/* What the card shows on this device: hidden | ios | unsupported | denied | off | on */
async function pushUiState(){
  try{
    if(!session || session.role === 'admin') return {mode:'hidden'};
    if(!(await pushServerKey())) return {mode:'hidden'};
    if(!pushCanUse()) return {mode: (pushIsIOS() && !pushStandalone()) ? 'ios' : 'unsupported'};
    if(Notification.permission === 'denied') return {mode:'denied'};
    const sub = await pushCurrentSub();
    if(sub && Notification.permission === 'granted' && pushListHas(PUSH_FLAG, session.id)) return {mode:'on'};
    return {mode:'off'};
  }catch(e){ return {mode:'hidden'}; }
}
/* Turns the pop-ups on for this device. Returns ok | denied | dismissed | fail */
async function pushEnable(){
  pushLastErr = '';
  if(!pushCanUse()) return pushFail('unsupported');
  let perm = Notification.permission;
  if(perm === 'default'){ try{ perm = await Notification.requestPermission(); }catch(e){ perm = 'default'; } }   // first thing, while the tap still counts
  if(perm === 'denied') return 'denied';
  if(perm !== 'granted') return 'dismissed';
  const key = await pushServerKey();
  const reg = await pushRegistration();
  if(!key) return pushFail('no-key');
  if(!reg) return pushFail('no-sw');
  if(!reg.pushManager) return pushFail('no-pushmanager');
  let sub = null;
  try{
    sub = await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey && !pushSameKey(new Uint8Array(sub.options.applicationServerKey), pushKeyBytes(key))){
      try{ await sub.unsubscribe(); }catch(e){}
      sub = null;
    }
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:pushKeyBytes(key)});
  }catch(e){ return pushFail('subscribe:' + ((e && e.name) || '?') + ':' + String((e && e.message) || '').slice(0, 70)); }
  try{ await rpc('app_push_subscribe', {p_token:authToken, p_sub:sub.toJSON(), p_ua:pushDeviceLabel()}, {retries:1}); }
  catch(e){ return pushFail('save:' + ((e && e.status) || '') + ':' + String((e && (e.reason || e.message)) || '?').slice(0, 70)); }
  pushListAdd(PUSH_FLAG, session.id);
  return 'ok';
}
async function pushDisable(){
  const sub = await pushCurrentSub();
  if(sub){
    try{ await rpc('app_push_unsubscribe', {p_token:authToken, p_endpoint:sub.endpoint}, {retries:1}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
  }
  pushListDel(PUSH_FLAG, session.id);
}
/* After signing in (or when the browser changed its subscription) the server is told again, so the right person gets the alerts on this device. */
async function pushResync(){
  if(!session || session.role === 'admin' || !pushCanUse()) return;
  if(Notification.permission !== 'granted' || !pushListHas(PUSH_FLAG, session.id)) return;
  const key = await pushServerKey();
  const reg = await pushRegistration();
  if(!key || !reg || !reg.pushManager) return;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){ try{ sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:pushKeyBytes(key)}); }catch(e){ return; } }
  await rpc('app_push_subscribe', {p_token:authToken, p_sub:sub.toJSON(), p_ua:pushDeviceLabel()}, {retries:0});
}
function pushSyncSoon(){
  if(pushSynced.id === session.id && pushSynced.tok === authToken) return;
  pushSynced = {id:session.id, tok:authToken};
  setTimeout(()=>{ pushResync().catch(()=>{}); }, 2500);
}
/* Signing out: this device stops getting this person's alerts (they come back at the next sign-in). */
async function pushForgetDevice(tok, uid){
  try{
    if(!uid || !pushListHas(PUSH_FLAG, uid) || !pushCanUse()) return;
    const sub = await Promise.race([pushCurrentSub(), new Promise(r=>setTimeout(()=>r(null), 2500))]);
    if(sub) await rpc('app_push_unsubscribe', {p_token:tok, p_endpoint:sub.endpoint}, {retries:0});
  }catch(e){}
}
function pushCardHtml(st){

function pushBannerHtml(st){

async function renderRoot(silent){

    if(!silent && session) ld = beginLoading();

function doLogout(){

/* ================= VIEW ROUTER ================= */
/* While a page loads the old one stays on screen (dimmed, with a progress line on top);
   a skeleton only appears when moving to a different page that is slow to arrive.
   Loading starts the moment a render is requested, before any database call is made. */
let navSeq = 0;
function viewKey(){ return (session ? session.role : '-') + '|' + route + '|' + (routeParams.id || routeParams.trainerId || ''); }
function beginLoading(){
  const app = document.getElementById('app');
  const ld = {seq: ++navSeq, routeChanged: app.__viewKey !== viewKey(), dim: null, skel: null};
  startProgress();
  ld.dim = setTimeout(()=>{ if(ld.seq===navSeq) app.classList.add('is-loading'); }, 140);
  if(ld.routeChanged) ld.skel = setTimeout(()=>{
    if(ld.seq!==navSeq) return;
    app.classList.remove('is-loading');
    app.innerHTML = skeletonHtml();
    app.__lastHtml = null;
  }, 380);
  return ld;
}
function endLoading(ld){
  clearTimeout(ld.dim); clearTimeout(ld.skel);
  if(ld.seq===navSeq){ document.getElementById('app').classList.remove('is-loading'); doneProgress(); }
}
async function renderView(silent, ld){
  clearRenderCaches();
  const app = document.getElementById('app');
  let own = null;
  if(!silent && !ld) ld = own = beginLoading();
  const seq = silent ? navSeq : ld.seq;
  const key = viewKey();
  const routeChanged = !silent && ld.routeChanged;
  try{
    let html = '';
    try{
      if(session.role==='customer') html = await renderCustomerView();
      else if(session.role==='trainer') html = await renderTrainerView();
      else if(session.role==='admin') html = await renderAdminView();
    }catch(e){
      if(e instanceof DbError){
        if(silent) return;                 // keep what is already on screen; the banner explains
        gateActive = true;
        html = offlineGateHtml();
      } else {
        console.error(e);
        html = `<div class="empty">Something went wrong loading this page.</div>`;
      }
    }
    if(seq !== navSeq) return;             // a newer navigation took over while this one was loading
    // A background refresh whose result is identical to what is showing changes nothing (no flicker, no lost state).
    if(silent && app.__lastHtml === html) return;
    app.__lastHtml = html;
    app.innerHTML = `<div class="view ${routeChanged ? 'anim-in' : ''}">${html}</div>`;
    app.__viewKey = key;
    if(routeChanged) window.scrollTo(0, 0);   // a new page always starts at the top
    bindGate();
    wireView();
  } finally {
    if(own) endLoading(own);
  }
}

/* ======================================================================
   CUSTOMER SYSTEM
   ====================================================================== */
function pkgUsable(p, today, trainerId){
  return p.status==='active' && p.remainingSessions>0 && p.expiryDate>=today && !!p.trainerId && (!trainerId || p.trainerId===trainerId);
}
/* A package only works with the trainer it was bought from. The old packages from the former admin
   catalogue (no trainerId) no longer work with anybody: the server refuses them too. */
async function getActivePackages(customerId, trainerId){
  const pkgs = await dbGetAll('custpkg:');
  const today = localDateStr();
  // A package must still be within its expiry window to actually be usable —
  // remainingSessions>0 alone isn't enough, otherwise a customer could keep
  // booking indefinitely on a package that expired months ago.
  return pkgs.filter(p=>p.customerId===customerId && pkgUsable(p, today, trainerId))
             .sort((a,b)=> new Date(a.expiryDate)-new Date(b.expiryDate));
}
async function getActivePackage(customerId, trainerId){
  return (await getActivePackages(customerId, trainerId))[0] || null;
}
/* True when the customer has at least one package that ran out purely
   because its expiry date passed — used to show a specific "expired,
   please renew" message instead of the generic "no package" one. */
async function hasExpiredUnusedPackage(customerId, trainerId){
  const pkgs = await dbGetAll('custpkg:');
  const today = localDateStr();
  return pkgs.some(p=>p.customerId===customerId && p.status==='active' && p.remainingSessions>0 && p.expiryDate<today && !!p.trainerId && (!trainerId || p.trainerId===trainerId));
}
/* Sessions left on old packages that name no trainer (they cannot be used any more; the person is told). */
async function legacyPackageSessions(customerId){
  const pkgs = await dbGetAll('custpkg:');
  const today = localDateStr();
  return pkgs.filter(p=>p.customerId===customerId && p.status==='active' && p.remainingSessions>0 && p.expiryDate>=today && !p.trainerId)

/* ======================================================================

   Each trainer sells their own packages (tpkg:) and leaves a payment QR
   (trainerpay:). The customer pays the trainer directly — the app never
   touches the money — and attaches the slip (slip:). The trainer, after
   seeing the money arrive, accepts the order (order:), which creates the
   customer's package (custpkg:) on the spot.
   ====================================================================== */
function tpkgsOf(all, trainerId, onlyOnSale){

   slip is sent and stays `provisional` until the trainer has seen the money; with the switch off the
   trainer must accept first. Either way a session is only used up when the trainer presses Done. */
function instantOf(rec){ return !rec || rec.instantCredit!==false; }
/* Small in-app yes/no sheet (the browser's own confirm() looks out of place in the installed app). */
function askConfirm(o){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-overlay show'; ov.style.zIndex = '260';
    ov.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><h2>${esc(o.title)}</h2><p>${esc(o.body)}</p>
      <button class="btn btn-primary btn-block" data-ask="ok">${esc(o.ok)}</button>
      <button class="btn btn-block btn-ghost" style="margin-top:10px" data-ask="no">${esc(o.cancel)}</button></div>`;
    const done = v=>{ document.removeEventListener('keydown', onKey, true); ov.remove(); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape'){ e.preventDefault(); done(false); } };
    ov.addEventListener('click', e=>{ const b = e.target.closest('[data-ask]'); if(b) done(b.dataset.ask==='ok'); else if(e.target===ov) done(false); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    const first = ov.querySelector('[data-ask="ok"]'); if(first) first.focus();
  });
}
/* The money did not arrive (or the customer withdrew): cancel the provisional package and every
   booking that was still open on it. Sessions already done stay on record. */
async function voidOrderPackage(o){
  const cpId = o.custpkgId || ('co_'+o.id);
  const cp = await dbGet('custpkg:'+cpId);
  if(!cp || !cp.provisional) return 0;
  cp.status = 'cancelled'; cp.provisional = false; cp.cancelledAt = new Date().toISOString();
  await dbSet('custpkg:'+cpId, cp);
  let n = 0;
  for(const b of await dbGetAll('booking:')){
    if(b.packageInstanceId===cpId && (b.status==='pending' || b.status==='confirmed')){
      b.status = 'cancelled'; await dbSet('booking:'+b.id, b); n++;
    }
  }
  return n;
}

async function submitOrder(){
  clearRenderCaches();                                // money-critical: read fresh data
  const p = payDraft.pkgId ? await dbGet('tpkg:'+payDraft.pkgId) : null;
  const trainer = p ? await dbGet('trainer:'+p.trainerId) : null;
  if(!p || p.status!=='active' || !(Number(p.price)>0) || !trainer || trainer.status!=='active'){ toast(t('pay_not_found')); return; }
  if(!payDraft.slip){ toast(t('pay_need_slip')); return; }
  const payRec = await dbGet('trainerpay:'+trainer.id);
  if(!(payRec && safePhoto(payRec.qr))){ toast(t('pay_no_qr')); return; }
  const orders = await dbGetAll('order:');
  if(orders.some(o=>o.customerId===session.id && o.tpkgId===p.id && o.status==='pending')){ toast(t('pay_dup')); return; }
  const instant = instantOf(payRec);
  const id = newId('ord');
  const cpId = 'co_'+id;
  const order = {id, customerId:session.id, customerName:session.name, trainerId:trainer.id, trainerName:trainer.name,
    tpkgId:p.id, packageName:p.name, sessions:Number(p.sessions), price:Number(p.price), expirationDays:Number(p.expirationDays)||90,
    instant, custpkgId: instant ? cpId : null, status:'pending', createdAt:new Date().toISOString()};
  // The slip image lives under its own key so lists of orders stay small.
  await dbSet('slip:'+id, {orderId:id, image:payDraft.slip, createdAt:order.createdAt});
  try{
    await dbSet('order:'+id, order);
    if(instant){
      await dbSet('custpkg:'+cpId, {id:cpId, customerId:session.id, trainerId:trainer.id, trainerName:trainer.name, orderId:id,
        packageId:p.id, packageName:p.name, totalSessions:order.sessions, usedSessions:0, remainingSessions:order.sessions,
        pricePaid:order.price, startDate:localDateStr(), expiryDate:addDays(order.expirationDays), status:'active', provisional:true});
    }
  }catch(e){
    for(const k of ['custpkg:'+cpId, 'order:'+id, 'slip:'+id]){ try{ await dbDelete(k); }catch(_){} }
    if(e instanceof ApiError && e.status!==401){ toast(apiErrText(e)); return; }
    throw e;
  }
  await pushNotification(trainer.id, 'nav_t_payments', instant ? 'notif_pay_new_instant' : 'notif_pay_new',
    {customer:session.name, pkg:p.name, price:Number(p.price).toLocaleString(), n:order.sessions}, null);
  payDraft = {pkgId:null, slip:''};
  toast(t(instant ? 'pay_toast_sent_instant' : 'pay_toast_sent'));
  if(instant) go('booking', {trainerId:trainer.id}); else go('package');
}
async function cancelOrder(id){
  clearRenderCaches();
  let o = await dbGet('order:'+id);
  if(!o || o.customerId!==session.id || o.status!=='pending'){ renderView(); return; }
  if(o.instant){

    if(!ok) return;
    clearRenderCaches();

  }

  renderView(); renderNav();
}

/* ---- trainer: accept (money seen) or decline an order ---- */
const orderBusy = new Set();
async function respondOrder(id, accept){
  if(orderBusy.has(id)) return;                       // double tap: the first press does the work
  orderBusy.add(id);
  try{ await respondOrderRun(id, accept); }
  catch(e){
    if(e instanceof ApiError && e.status!==401){ toast(e.reason==='bad_transition' ? t('tpay_already') : apiErrText(e)); clearRenderCaches(); renderView(); renderNav(); return; }
    throw e;
  } finally { orderBusy.delete(id); }
}
async function respondOrderRun(id, accept){
  clearRenderCaches();                                // another device may have answered already
  const o = await dbGet('order:'+id);
  if(!o || o.trainerId!==session.id){ renderView(); return; }
  if(o.status!=='pending'){ toast(t('tpay_already')); renderView(); renderNav(); return; }
  const now = new Date().toISOString();
  if(accept){
    const cpId = o.custpkgId || ('co_'+o.id);     // one package per order, even if the button is pressed twice
    const ex = await dbGet('custpkg:'+cpId);
    if(!ex){
      await dbSet('custpkg:'+cpId, {id:cpId, customerId:o.customerId, trainerId:o.trainerId, trainerName:o.trainerName, orderId:o.id,
        packageId:o.tpkgId, packageName:o.packageName, totalSessions:o.sessions, usedSessions:0, remainingSessions:o.sessions,
        pricePaid:o.price, startDate:localDateStr(), expiryDate:addDays(o.expirationDays||90), status:'active'});
    } else if(ex.provisional){
      ex.provisional = false;                       // money seen: the package is now final
      await dbSet('custpkg:'+cpId, ex);
    }
    o.status = 'approved'; o.decidedAt = now; o.custpkgId = cpId;
    await dbSet('order:'+id, o);
    await pushNotification(o.customerId, 'nav_c_package', 'notif_pay_approved', {trainer:o.trainerName, n:o.sessions, pkg:o.packageName}, null);
    toast(tt(o.instant ? 'tpay_toast_confirmed' : 'tpay_toast_approved', {name:o.customerName}));
  } else {
    if(o.instant) await voidOrderPackage(o);
    o.status = 'rejected'; o.decidedAt = now;
    await dbSet('order:'+id, o);
    await pushNotification(o.customerId, 'nav_c_package', o.instant ? 'notif_pay_rejected_void' : 'notif_pay_rejected', {trainer:o.trainerName, pkg:o.packageName}, null);
    toast(tt(o.instant ? 'tpay_toast_voided' : 'tpay_toast_rejected', {name:o.customerName}));
  }
  try{ await dbDelete('slip:'+id); }catch(_){}      // the slip has done its job
  renderView(); renderNav();
}

async function saveTrainerPackageField(id, field, raw){
  const p = await dbGet('tpkg:'+id);
  if(!p || p.trainerId!==session.id) return;
  const bad = ()=>{ toast(t('tpk_invalid')); renderView(); };
  let v;
  if(field==='name'){ v = String(raw||'').trim().slice(0,40); if(!v) return bad(); }
  else if(field==='sessions' || field==='expirationDays'){
    v = Math.floor(Number(raw)); const max = field==='sessions' ? 200 : 730;
    if(!(v>=1 && v<=max)) return bad();
  }
  else if(field==='price'){ v = Math.round(Number(raw)*100)/100; if(!(v>=0 && v<=1000000)) return bad(); }
  else if(field==='status'){ if(raw!=='active' && raw!=='hidden') return; v = raw; if(v==='active' && !(Number(p.price)>0)) return bad(); }
  else return;
  if(p[field]===v) return;
  p[field] = v;
  let rerender = false;
  if(field==='price' && !(v>0) && p.status==='active'){ p.status = 'hidden'; rerender = true; }   // no price, nothing to sell
  await dbSet('tpkg:'+id, p);
  toast(t('tpk_toast_saved'));
  if(rerender) renderView();
}

/* Pinned trainers float to the top, most-recently-pinned first; everyone
   else keeps whatever order they were already in. This is per-customer
   (stored on the customer record) so it never affects what other
   customers or the trainer/admin systems see. */
function sortTrainersByPin(trainers, pinnedIds){
  if(!pinnedIds || !pinnedIds.length) return trainers;
  const rank = new Map(pinnedIds.map((id,i)=>[id,i]));
  return [...trainers].sort((a,b)=>{
    const ra = rank.has(a.id) ? rank.get(a.id) : Infinity;
    const rb = rank.has(b.id) ? rank.get(b.id) : Infinity;
    return ra - rb;
  });
}
async function togglePinTrainer(id){
  const c = await dbGet('customer:'+session.id);
  if(!c) return;
  c.pinnedTrainerIds = c.pinnedTrainerIds || [];
  c.myTrainerIds = c.myTrainerIds || [];
  if(!c.myTrainerIds.includes(id)) c.myTrainerIds.push(id);   // pinning keeps a trainer in the customer's own list
  const trainer = await dbGet('trainer:'+id);
  const idx = c.pinnedTrainerIds.indexOf(id);
  if(idx >= 0){
    c.pinnedTrainerIds.splice(idx,1);
    toast(tt('tr_unpinned_toast',{name: trainer?trainer.name:''}));
  } else {
    c.pinnedTrainerIds.unshift(id);
    toast(tt('tr_pinned_toast',{name: trainer?trainer.name:''}));
  }
  await dbSet('customer:'+c.id, c);
  renderView();
}

/* ======================================================================
   TRAINERS ARE FOUND BY CODE ONLY
   A customer cannot browse or search trainers. They type the personal
   code (#AB7K) a trainer gave them; that adds the trainer to "my
   trainers" (customer.myTrainerIds), which is the only list the profile
   and booking pages work from. Trainers a customer already pinned or
   booked before this change are kept automatically.
   NOTE: this is a screen-level rule. Until the database itself is locked
   down with Supabase Auth + row-level security, someone technical could
   still read trainer rows straight from the database.
   ====================================================================== */
function normCode(raw){ return String(raw||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,8); }
async function getMyTrainerIdSet(){
  const [c, bookings] = await Promise.all([dbGet('customer:'+session.id), dbGetAll('booking:')]);
  const ids = new Set([...((c && c.myTrainerIds) || []), ...((c && c.pinnedTrainerIds) || [])]);
  bookings.forEach(b=>{ if(b.customerId===session.id && b.trainerId) ids.add(b.trainerId); });
  return ids;
}
async function getMyTrainers(){
  const [ids, all, pinnedIds] = await Promise.all([getMyTrainerIdSet(), getApprovedTrainers(), getPinnedTrainerIds()]);
  return sortTrainersByPin(all.filter(x=>ids.has(x.id)), pinnedIds);
}
const codeTries = {n:0, until:0};
async function lookupTrainerByCode(raw){
  const code = normCode(raw);
  if(!code) return {error:'empty'};
  const now = Date.now();
  if(now < codeTries.until) return {error:'throttle', wait:Math.ceil((codeTries.until-now)/1000)};
  clearRenderCaches();
  const r = await findTrainerByCode(code);
  if(r.error==='throttle') return r;
  if(!r.tr){
    codeTries.n++;
    if(codeTries.n >= 5){ codeTries.until = now + 30000; codeTries.n = 0; }   // slow down code guessing
    return {error:'notfound'};
  }
  codeTries.n = 0;
  return {tr:r.tr};
}
async function addTrainerToMine(tr){
  const c = await dbGet('customer:'+session.id);
  if(!c) return;
  c.myTrainerIds = c.myTrainerIds || [];
  if(!c.myTrainerIds.includes(tr.id)){ c.myTrainerIds.unshift(tr.id); await dbSet('customer:'+c.id, c); }
}
async function submitTrainerCode(inputEl, btn, msgEl, fieldEl){
  if(!inputEl) return;
  const show = (cls, text)=>{ if(msgEl){ msgEl.className = 'code-msg ' + cls; msgEl.textContent = text; } };
  const fail = (text)=>{
    show('err', text);
    if(fieldEl){ fieldEl.classList.remove('shake'); void fieldEl.offsetWidth; fieldEl.classList.add('shake'); }
  };
  await withBusy(btn, async ()=>{
    try{
      const r = await lookupTrainerByCode(inputEl.value);
      if(r.error==='empty') return fail(t('ct_code_empty'));
      if(r.error==='throttle') return fail(tt('ct_code_throttle',{s:r.wait}));
      if(r.error==='notfound') return fail(t('ct_code_notfound'));
      const already = (await getMyTrainerIdSet()).has(r.tr.id);
      await addTrainerToMine(r.tr);
      const msg = tt(already ? 'ct_code_already' : 'ct_code_added', {name:r.tr.name});
      show('ok', '✓ ' + msg);
      toast(msg);
      // Straight on to the trainer's profile -- no extra tap needed.
      setTimeout(()=>{ if(session && session.role==='customer' && (route==='trainers' || route==='dashboard')) go('trainerProfile', {id:r.tr.id}); }, 650);
    }catch(e){
      if(e instanceof DbError) fail(t('conn_save_failed')); else throw e;
    }
  });
}

/* Booking looks 14 days ahead. The list is made when it is needed (not once at load), so a page left open overnight
   still starts on today. */
const BOOK_AHEAD = 14;
function bookingDays(){
  const arr = [], start = new Date();
  for(let i=0;i<BOOK_AHEAD;i++){ const d = new Date(start); d.setDate(start.getDate()+i); arr.push(localDateStr(d)); }
  return arr;
}
const TIMES = { morning:['06:00','07:00','08:00','09:00','10:00','11:00'], afternoon:['13:00','14:00','15:00','16:00'], evening:['17:00','18:00','19:00','20:00'] };
let bookingState = { trainerId:null, day:localDateStr(), cat:'morning', picks:[] };   // picks: 'YYYY-MM-DD|HH:MM', as many as the person taps
let bookingCtx = null;                                                                   // what the page was drawn from (trainer, bookings, room left on packages)

/* ======================================================================
   BOOKING
   A booking goes straight onto the trainer's schedule: the trainer already set how much
   notice is needed, so nobody has to accept it. The first customer to book a time gets it;
   the server enforces this (a second customer is refused with "locked").
   Older "waiting" requests from before this change were turned into bookings by the server
   update; the old accept / pair-session code below is only kept so none of them can get stuck.
   ====================================================================== */
const DUO_CAPACITY = 2;
const ACTIVE_BOOKING_STATUSES = ['pending','confirmed'];

function bookingsAtSlot(all, trainerId, date, time){
  return all.filter(b=> b.trainerId===trainerId && b.bookingDate===date && b.bookingTime===time && ACTIVE_BOOKING_STATUSES.includes(b.status));
}
/* Returns why (if at all) a customer cannot book this slot. */
function slotAvailability(all, trainerId, date, time, customerId){
  const at = bookingsAtSlot(all, trainerId, date, time);
  if(customerId && at.some(b=>b.customerId===customerId)) return {ok:false, reason:'already_mine', pending:0};
  if(at.length) return {ok:false, reason:'locked', pending:0};
  return {ok:true, reason:null, pending:0};
}

/* ---- minimum booking notice (set by each trainer, default 1 hour) ---- */
const DEFAULT_LEAD_HOURS = 1;
const LEAD_OPTIONS = [0,1,2,3,4,6,12,24,48];
function leadHoursOf(tr){
  const raw = tr ? tr.leadHours : undefined;
  if(raw===undefined || raw===null || raw==='') return DEFAULT_LEAD_HOURS;
  const h = Number(raw);
  return (isFinite(h) && h>=0) ? h : DEFAULT_LEAD_HOURS;
}
function leadLabel(h){
  if(h===0) return t('tlead_opt_0');
  if(h===1) return t('tlead_opt_one');
  if(h>=24 && h%24===0) return h===24 ? t('tlead_opt_day_one') : tt('tlead_opt_days',{n:h/24, h:h});
  return tt('tlead_opt_hours',{n:h});
}
/* true when the slot starts sooner than the trainer's notice (also covers slots already in the past) */
function slotTooSoon(trainer, date, time){
  const start = new Date(date+'T'+time+':00').getTime();
  if(!isFinite(start)) return false;
  return start - Date.now() < leadHoursOf(trainer) * 3600000;
}
function leadShort(h){
  if(h===0) return t('tlead_short_none');
  if(h>=24 && h%24===0) return tt('tlead_short_d',{n:h/24});
  return tt('tlead_short_h',{n:h});
}
/* one row of buttons at the top of the schedule page: the current value is highlighted, one tap saves */
function leadBarHtml(tr){
  const cur = leadHoursOf(tr);
  const opts = LEAD_OPTIONS.includes(cur) ? LEAD_OPTIONS : LEAD_OPTIONS.concat([cur]).sort((a,b)=>a-b);
  let example = '';
  if(cur>=1 && cur<=12){
    const m = 18*60 - Math.round(cur*60);
    example = tt('tlead_example',{time:String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});
  }
  return `
    <div class="card lead-bar">
      <div class="lead-top"><div class="lead-title">${t('tlead_bar_title')}</div><div class="lead-now">${esc(leadLabel(cur))}</div></div>
      <div class="lead-pills" role="radiogroup" aria-label="${esc(t('tlead_bar_title'))}">
        ${opts.map(h=>`<button type="button" role="radio" aria-checked="${h===cur}" class="lead-pill ${h===cur?'sel':''}" data-lead-pill="${h}">${esc(leadShort(h))}</button>`).join('')}
      </div>
      <p class="lead-hint">${example ? esc(example)+'<br>' : ''}${esc(t('tlead_bar_hint'))}</p>
    </div>`;
}
async function saveLeadHours(h){
  if(!isFinite(h) || h<0) return;
  clearRenderCaches();
  const tr = await dbGet('trainer:'+session.id);
  if(!tr) return;
  tr.leadHours = h;
  await dbSet('trainer:'+tr.id, tr);
  toast(tt('tlead_toast',{label:leadLabel(h)}));
  renderView();
}

function pickKey(date, time){ return date + '|' + time; }
function pickSplit(k){ const i = k.indexOf('|'); return {date:k.slice(0,i), time:k.slice(i+1)}; }
function sortedPicks(){ return bookingState.picks.slice().sort(); }          // 'YYYY-MM-DD|HH:MM' sorts by day, then time
function weekdayShort(dow){ return lang==='th' ? ['อา','จ','อ','พ','พฤ','ศ','ส'][dow] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow]; }
/* How many more sessions each package of this trainer can take: what is left, minus what is already booked on it. */
function pkgRoom(pkgs, allBookings){
  return pkgs.map(p=>{
    const open = allBookings.filter(b=>b.packageInstanceId===p.id && ACTIVE_BOOKING_STATUSES.includes(b.status)).length;
    return {pkg:p, room:Math.max(0, (p.remainingSessions||0) - open)};
  });
}
/* Gives each picked time (earliest first) to the package that expires first and is still valid that day and has room. */
function assignPicks(keys, rooms){
  const left = rooms.map(r=>({pkg:r.pkg, room:r.room})).sort((x,y)=> String(x.pkg.expiryDate).localeCompare(String(y.pkg.expiryDate)));
  const assigned = [], over = [];
  keys.slice().sort().forEach(k=>{
    const slot = left.find(r=> r.room>0 && String(r.pkg.expiryDate) >= pickSplit(k).date);
    if(slot){ slot.room--; assigned.push({key:k, pkg:slot.pkg}); } else over.push(k);
  });
  return {assigned, over};
}
/* 'ok' (free) | 'mine' (already booked by this person) | 'taken' | 'late' (inside the trainer's notice) | 'beyond' (after the package runs out) */
function slotState(date, time){
  const c = bookingCtx;
  if(!c || !c.trainer) return 'taken';
  if(c.lastDay && date > c.lastDay) return 'beyond';
  if(slotTooSoon(c.trainer, date, time)) return 'late';
  const av = slotAvailability(c.allBookings, c.trainer.id, date, time, session.id);
  return av.ok ? 'ok' : (av.reason==='already_mine' ? 'mine' : 'taken');
}
/* Adds or removes one picked time. Returns false (with a message) when it cannot be added. */
function togglePick(date, time){
  const c = bookingCtx, k = pickKey(date, time);
  const i = bookingState.picks.indexOf(k);
  if(i >= 0){ bookingState.picks.splice(i, 1); return true; }
  if(!c || !c.rooms.length){ toast(t('cb_no_package')); return false; }
  if(slotState(date, time) !== 'ok') return false;
  const now = bookingState.picks.length;
  if(now >= c.maxN || assignPicks(bookingState.picks.concat(k), c.rooms).over.length){
    const more = Math.max(0, c.maxN - now);
    toast(more > 0 ? tt('cb_cap_reached',{n:more}) : t('cb_cap_zero'));
    return false;
  }
  bookingState.picks.push(k);
  return true;
}
/* The weekday + time this customer keeps coming at with this trainer (at least twice in the last 8 weeks). */
function usualTimes(allBookings, trainerId){
  const since = localDateStr(new Date(Date.now() - 56*86400000));
  const m = new Map();
  allBookings.filter(b=> b.customerId===session.id && b.trainerId===trainerId && b.bookingDate>=since && ['confirmed','completed','no_show'].includes(b.status)).forEach(b=>{
    const dow = new Date(b.bookingDate+'T00:00:00').getDay();
    const k = dow + '|' + b.bookingTime;
    const e = m.get(k) || {dow, time:b.bookingTime, n:0};
    e.n++; m.set(k, e);
  });
  return [...m.values()].filter(e=>e.n>=2).sort((x,y)=> y.n-x.n || x.dow-y.dow || x.time.localeCompare(y.time)).slice(0,5);
}
function applyUsual(){
  const c = bookingCtx;
  if(!c || !c.usual.length) return;
  const want = [];
  c.days.forEach(d=>{ const dow = new Date(d+'T00:00:00').getDay(); c.usual.forEach(u=>{ if(u.dow===dow) want.push(pickKey(d, u.time)); }); });
  let added = 0, skipped = 0;
  want.sort().forEach(k=>{
    if(bookingState.picks.includes(k)) return;
    const {date, time} = pickSplit(k);
    if(slotState(date, time) !== 'ok' || bookingState.picks.length >= c.maxN || assignPicks(bookingState.picks.concat(k), c.rooms).over.length){ skipped++; return; }
    bookingState.picks.push(k); added++;
  });
  toast(!added ? t('cb_usual_none') : skipped ? tt('cb_usual_part',{n:added}) : tt('cb_usual_done',{n:added}));
  if(added) bookingState.day = pickSplit(sortedPicks()[0]).date;       // show where the first one landed
  refreshBookingDyn();
}

/* The part of the booking page that changes with every tap. It is drawn from bookingCtx and bookingState alone
   (no new download per tap), so tapping many times stays quick. */
function bookingDynHtml(){
  const c = bookingCtx, trainer = c.trainer;
  const picks = sortedPicks();
  const pickOn = {}, haveOn = {};
  picks.forEach(k=>{ const d = pickSplit(k).date; pickOn[d] = (pickOn[d]||0) + 1; });
  c.allBookings.forEach(b=>{ if(b.customerId===session.id && b.trainerId===trainer.id && ACTIVE_BOOKING_STATUSES.includes(b.status)) haveOn[b.bookingDate] = (haveOn[b.bookingDate]||0) + 1; });
  const today = c.days[0];
  const dayPills = c.days.map(d=>{
    const dt = new Date(d+'T00:00:00');
    const np = pickOn[d] || 0, nh = haveOn[d] || 0;
    const label = fmtDate(d) + (np ? ' · ' + tt('cb_sum_n',{n:np}) : '') + (nh ? ' · ' + t('cb_legend_have') : '');
    return `<div class="day-pill ${bookingState.day===d?'sel':''} ${np?'has-pick':''} ${nh?'has-book':''} ${(c.lastDay && d>c.lastDay)?'off':''} ${d===today?'today':''}" data-day="${d}" role="button" aria-pressed="${bookingState.day===d}" aria-label="${esc(label)}"><div class="d">${weekdayShort(dt.getDay())}</div><div class="n">${dt.getDate()}</div><i class="dot"></i>${np ? `<span class="cnt">${np}</span>` : ''}</div>`;
  }).join('');
  const timeGrid = (TIMES[bookingState.cat]||[]).map(tm=>{
    const st = slotState(bookingState.day, tm);
    const on = bookingState.picks.includes(pickKey(bookingState.day, tm));
    return `<div class="time-slot ${on?'sel':''} ${st==='ok'?'':'taken'} ${st==='mine'?'mine':''}" data-time="${tm}" aria-pressed="${on}">${fmtTime(tm)}${st==='mine' ? `<span class="ts-tag">${t('cb_slot_mine_tag')}</span>` : ''}</div>`;
  }).join('');
  const leadH = leadHoursOf(trainer);
  const leadNote = leadH>0 ? `<div class="lead-note" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="lead-note-t">${t('cb_lead_note_a')} <b class="lead-note-n">${esc(leadLabel(leadH))}</b><span class="lead-note-s">${t('cb_lead_note_b')}</span></div></div>` : '';
  const beyond = (c.lastDay && c.lastDay < c.days[c.days.length-1]) ? `<p class="slot-hint">${tt('cb_beyond_pkg',{date:fmtDate(c.lastDay)})}</p>` : '';
  const usual = c.usual.length ? `<div class="usual-box"><div class="usual-t">${t('cb_usual_title')}</div><div class="usual-l">${c.usual.map(u=>`<span>${weekdayShort(u.dow)} ${fmtTime(u.time)}</span>`).join('')}</div><button type="button" class="btn btn-sm" id="usualBtn">${t('cb_usual_btn')}</button></div>` : '';
  const chips = picks.map(k=>{
    const p = pickSplit(k);
    return `<button type="button" class="pick-chip" data-unpick="${esc(k)}" aria-label="${esc(t('cb_unpick'))}: ${esc(fmtDate(p.date))} ${esc(fmtTime(p.time))}"><b>${esc(fmtDate(p.date))}</b> ${esc(fmtTime(p.time))}<i aria-hidden="true">×</i></button>`;
  }).join('');
  const more = Math.max(0, c.maxN - picks.length);
  return `
    ${usual}
    <label>${t('cb_days_label')}</label>
    <div class="day-strip day-grid" id="dayStrip">${dayPills}</div>
    <div class="day-legend"><span><i class="lg lg-pick"></i>${t('cb_legend_pick')}</span><span><i class="lg lg-have"></i>${t('cb_legend_have')}</span></div>
    ${beyond}
    <label>${t('cb_cat_label')}</label>
    <div class="cat-row">
      <button type="button" class="cat-pill ${bookingState.cat==='morning'?'sel':''}" data-cat="morning">${t('cb_cat_morning')}</button>
      <button type="button" class="cat-pill ${bookingState.cat==='afternoon'?'sel':''}" data-cat="afternoon">${t('cb_cat_afternoon')}</button>
      <button type="button" class="cat-pill ${bookingState.cat==='evening'?'sel':''}" data-cat="evening">${t('cb_cat_evening')}</button>
    </div>
    <label>${tt('cb_times_for',{date:esc(fmtDate(bookingState.day))})}</label>
    ${leadNote}
    <div class="time-grid" id="timeGrid">${timeGrid}</div>
    <p class="slot-hint" style="margin:-8px 0 14px">${t('cb_tap_hint')}</p>
    <div class="picks-box ${picks.length?'has':''}" id="picksBox">
      <div class="picks-head"><b>${t('cb_picks_title')}</b><span class="picks-n">${picks.length}</span><span class="picks-left">${tt('cb_picks_left',{n:more})}</span></div>
      ${picks.length ? `<div class="picks-list">${chips}</div>` : `<div class="picks-none">${t('cb_picks_none')}</div>`}
    </div>
    <button class="btn btn-primary btn-block" id="submitBookingBtn" ${!c.rooms.length?'disabled':''}>${picks.length>1 ? tt('cb_submit_n',{n:picks.length}) : t('cb_submit_btn')}</button>`;
}
function bookingSumHtml(){
  const c = bookingCtx, trainer = c.trainer;
  const left = c.rooms.reduce((n,r)=> n + (r.pkg.remainingSessions||0), 0), total = c.rooms.reduce((n,r)=> n + (r.pkg.totalSessions||0), 0);
  const n = bookingState.picks.length;
  return `
    <div class="card-head"><h3>${t('cb_summary_title')}</h3></div>

function wireBooking(){
  const dyn = document.getElementById('bookingDyn');
  if(!dyn) return;
  dyn.querySelectorAll('#dayStrip .day-pill').forEach(el=>el.addEventListener('click', ()=>{ bookingState.day = el.dataset.day; refreshBookingDyn(); }));

  dyn.querySelectorAll('.time-slot[data-time]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.classList.contains('taken')) return;
    togglePick(bookingState.day, el.dataset.time);
    refreshBookingDyn();
  }));
  dyn.querySelectorAll('[data-unpick]').forEach(el=>el.addEventListener('click', ()=>{
    bookingState.picks = bookingState.picks.filter(k=>k!==el.dataset.unpick);
    refreshBookingDyn();

  if(usualBtn) usualBtn.addEventListener('click', applyUsual);
  const submitBtn = document.getElementById('submitBookingBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=> withBusy(submitBtn, submitBooking));
}

/* One notice for the trainer, however many sessions were booked in this go. */
async function notifyTrainerBooked(trainer, done){
  const sorted = done.slice().sort((x,y)=> (x.bookingDate+x.bookingTime).localeCompare(y.bookingDate+y.bookingTime));
  if(sorted.length === 1){
    const b = sorted[0];
    return pushNotification(trainer.id, 'nav_t_schedule', 'notif_new_booking', {customer:session.name, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, b.id);
  }
  const list = sorted.slice(0,6).map(b=> fmtDate(b.bookingDate) + ' ' + fmtTime(b.bookingTime)).join(', ') + (sorted.length > 6 ? ' +' + (sorted.length - 6) : '');
  return pushNotification(trainer.id, 'nav_t_schedule', 'notif_new_booking_multi', {customer:session.name, n:sorted.length, list}, sorted[0].id);
}

async function submitBooking(){
  clearRenderCaches();                                  // read the trainer's notice setting, the packages and the slots fresh
  const trainer = bookingState.trainerId ? await dbGet('trainer:'+bookingState.trainerId) : null;
  const pkgs = trainer ? await getActivePackages(session.id, trainer.id) : [];
  const keys = sortedPicks();
  if(!trainer || !pkgs.length || !keys.length){ toast(t('cb_no_time_selected')); return; }
  const fresh = await dbGetAll('booking:');
  const plan = assignPicks(keys, pkgRoom(pkgs, fresh));
  const done = [], failed = plan.over.map(k=>({key:k, why:t('cb_cap_zero')}));
  let fatal = null;
  try{
    for(const {key, pkg} of plan.assigned){
      const {date, time} = pickSplit(key);
      if(slotTooSoon(trainer, date, time)){ failed.push({key, why:tt('cb_slot_too_soon',{label:leadLabel(leadHoursOf(trainer))})}); continue; }
      // re-check against fresh data so two customers racing for the same time never both get it
      const av = slotAvailability(fresh, trainer.id, date, time, session.id);
      if(!av.ok){ failed.push({key, why: av.reason==='already_mine' ? t('cb_slot_already_mine') : t('cb_slot_locked')}); continue; }
      const booking = {
        id:newId('bk'), customerId:session.id, customerName:session.name, trainerId:trainer.id, trainerName:trainer.name,
        packageInstanceId: pkg.id, bookingDate: date, bookingTime: time,
        status:'confirmed', sessionMode:'solo', partnerNames:[], createdAt:new Date().toISOString(), completedAt:null
      };
      try{ await dbSet('booking:'+booking.id, booking); }
      catch(e){
        if(e instanceof ApiError && e.status!==401){
          failed.push({key, why: e.reason==='too_soon' ? tt('cb_slot_too_soon',{label:leadLabel(leadHoursOf(trainer))}) : apiErrText(e)});
          continue;
        }
        throw e;
      }
      fresh.push(booking); done.push(booking);
    }
  }catch(e){ fatal = e; }
  // whatever happened, the times that were booked leave the selection; the ones that failed stay until the page checks them again
  const gone = new Set(done.map(b=>pickKey(b.bookingDate, b.bookingTime)));
  bookingState.picks = bookingState.picks.filter(k=>!gone.has(k));
  if(done.length){ try{ await notifyTrainerBooked(trainer, done); }catch(e){ console.warn('trainer notice not sent', e && e.message); } }
  if(fatal){ if(done.length) renderView(); throw fatal; }
  if(!done.length){
    toast(failed.length ? failed[0].why : t('cb_no_time_selected'));
    renderView();
    return;
  }
  const multi = done.length > 1 || failed.length > 0;      // a list to read: no automatic jump to the next page
  const sorted = done.slice().sort((x,y)=> (x.bookingDate+x.bookingTime).localeCompare(y.bookingDate+y.bookingTime));
  document.getElementById('modalTitle').textContent = done.length > 1 ? tt('cb_multi_title',{n:done.length}) : t('modal_title');
  document.getElementById('modalBody').textContent = done.length > 1 ? t('cb_multi_body') : t('modal_body');
  const list = document.getElementById('modalList');
  list.textContent = '';
  sorted.forEach(b=>{
    const li = document.createElement('li');
    const a1 = document.createElement('span'); a1.textContent = fmtDate(b.bookingDate);
    const a2 = document.createElement('b'); a2.textContent = fmtTime(b.bookingTime);
    li.appendChild(a1); li.appendChild(a2); list.appendChild(li);
  });
  document.getElementById('modalNote').textContent = failed.length ? tt('cb_multi_fail',{n:failed.length}) : (multi ? '' : t('modal_redirect'));
  document.getElementById('modalCloseBtn').textContent = t('modal_go');
  document.querySelector('#bookingModal .modal-box').classList.toggle('no-count', multi);
  document.getElementById('bookingModal').classList.add('show');
  clearTimeout(modalGoTimer);
  modalGoTimer = multi ? null : setTimeout(()=>closeBookingModal(true), 2800);   // matches the countdown bar
}

/* ---- time helpers for the schedule (all times are the trainer's local clock) ---- */
const SESSION_MIN = 60;
function hmToMin(tm){ const p = String(tm||'0:0').split(':').map(Number); return (p[0]||0)*60 + (p[1]||0); }
function minToHm(m){ m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function dayDiff(fromIso, toIso){ return Math.round((new Date(toIso+'T00:00:00') - new Date(fromIso+'T00:00:00')) / 86400000); }
/* late = the hour is over and the result has not been recorded; now = the session is going on; soon = later today; future = another day */
function sessionPhase(b, today, nowMin){
  if(b.bookingDate < today) return 'late';
  if(b.bookingDate > today) return 'future';
  const st = hmToMin(b.bookingTime);
  if(nowMin >= st + SESSION_MIN) return 'late';
  if(nowMin >= st) return 'now';
  return 'soon';
}
function dayHeading(iso, today){
  const tm = new Date(today+'T00:00:00'); tm.setDate(tm.getDate()+1);
  if(iso === today) return t('ts_today');
  if(iso === localDateStr(tm)) return t('ts_tomorrow');
  return fmtDate(iso);
}

  // Group pending requests that target the exact same date+time, so the
  // trainer can decide between a pair session and a solo lock.
  const groups = [];
  const bySlot = {};
  bookings.forEach(b=>{
    const key = b.bookingDate+'|'+b.bookingTime;
    if(!bySlot[key]){ bySlot[key] = {key, date:b.bookingDate, time:b.bookingTime, items:[]}; groups.push(bySlot[key]); }

          <div class="duo-person">

              <button class="btn btn-sm btn-ghost" data-accept-booking="${b.id}">${t('duo_accept_only')}</button>

}

/* Accept a single request as a SOLO session: the slot is locked and every
   other pending request at that exact slot is bounced out automatically. */
async function respondBooking(id, accept){
  const b = await dbGet('booking:'+id);
  if(!b || b.status!=='pending') return;
  b.status = accept ? 'confirmed' : 'rejected';
  if(accept){ b.sessionMode = 'solo'; b.partnerNames = []; }
  await dbSet('booking:'+id, b);
  if(accept){
    await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, b.id);
    // bounce out the other pending requests competing for this slot
    const all = await dbGetAll('booking:');
    const losers = all.filter(x=> x.id!==b.id && x.trainerId===b.trainerId && x.bookingDate===b.bookingDate && x.bookingTime===b.bookingTime && x.status==='pending');
    for(const l of losers){
      l.status = 'rejected';
      await dbSet('booking:'+l.id, l);
      await pushNotification(l.customerId, 'nav_c_booking', 'notif_slot_lost', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, l.id);
    }
    toast(losers.length ? t('duo_toast_solo') : t('tq_toast_accept'));
  } else {
    await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_rejected', {trainer:b.trainerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}, b.id);
    toast(t('tq_toast_reject'));
  }
  renderView(); renderNav();
}

/* Accept every pending request at a slot together as a PAIR session. */
async function acceptDuo(slotKey){
  const [date, time] = slotKey.split('|');
  const all = await dbGetAll('booking:');
  const pending = all
    .filter(b=> b.trainerId===session.id && b.bookingDate===date && b.bookingTime===time && b.status==='pending')
    .sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
  if(!pending.length) return;

  const accepted = pending.slice(0, DUO_CAPACITY);
  const overflow = pending.slice(DUO_CAPACITY); // more than the pair can hold
  const names = accepted.map(b=>b.customerName);

  for(const b of accepted){
    b.status = 'confirmed';
    b.sessionMode = accepted.length > 1 ? 'duo' : 'solo';
    b.partnerNames = names.filter(n=> n!==b.customerName);
    await dbSet('booking:'+b.id, b);
    if(b.sessionMode === 'duo'){
      await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted_duo', {trainer:b.trainerName, date:fmtDate(date), time:fmtTime(time), partner:b.partnerNames.join(', ')}, b.id);
    } else {
      await pushNotification(b.customerId, 'nav_c_mybookings', 'notif_accepted', {trainer:b.trainerName, date:fmtDate(date), time:fmtTime(time)}, b.id);
    }
  }
  for(const l of overflow){
    l.status = 'rejected';
    await dbSet('booking:'+l.id, l);
    await pushNotification(l.customerId, 'nav_c_booking', 'notif_slot_lost', {trainer:l.trainerName, date:fmtDate(date), time:fmtTime(time)}, l.id);
  }
  toast(tt('duo_toast_both',{count:accepted.length}));
  renderView(); renderNav();
}

/* The trainer cannot make it (or the customer asked to move): the booking is cancelled and the customer is told.
   Nothing was deducted yet, so the customer keeps the session. */
async function cancelBookingByTrainer(id){
  if(finishLocks.has('c'+id)) return;
  finishLocks.add('c'+id);
  try{
    clearRenderCaches();
    const b = await dbGet('booking:'+id);
    if(!b || b.status!=='confirmed') return;
    const ok = await askConfirm({title:t('tcan_title'),
      body:tt('tcan_body', {name:b.customerName, date:fmtDate(b.bookingDate), time:fmtTime(b.bookingTime)}),
      ok:t('tcan_ok'), cancel:t('tcan_no')});
    if(!ok) return;
    const fresh = await dbGet('booking:'+id);
    if(!fresh || fresh.status!=='confirmed') return;
    fresh.status = 'cancelled';
    await dbSet('booking:'+id, fresh);
    await pushNotification(fresh.customerId, 'nav_c_mybookings', 'notif_cancelled_by_trainer', {trainer:fresh.trainerName, date:fmtDate(fresh.bookingDate), time:fmtTime(fresh.bookingTime)}, fresh.id);
    toast(t('tcan_toast'));
    renderView(); renderNav();
  } finally { finishLocks.delete('c'+id); }
}
const finishLocks = new Set();
/* Recording a session uses it up. While the package is still waiting for the trainer to see the
   money, ask first (one tap) so a session is never used up on an unchecked payment. */
async function finishBooking(id, noShow){
  if(finishLocks.has(id)) return;
  finishLocks.add(id);
  try{
    clearRenderCaches();
    const b = await dbGet('booking:'+id);
    if(!b || b.status!=='confirmed') return;
    if(b.packageInstanceId){
      const gp = await dbGet('custpkg:'+b.packageInstanceId);
      const ord = (gp && gp.provisional && gp.orderId) ? await dbGet('order:'+gp.orderId) : null;
      if(ord && ord.status==='pending'){
        const ok = await askConfirm({title:t('tgate_title'),
          body:tt('tgate_body', {name:b.customerName, pkg:ord.packageName, price:Number(ord.price).toLocaleString()}),
          ok:t('tgate_ok'), cancel:t('tgate_cancel')});
        if(!ok) return;
        await respondOrder(ord.id, true);
        const again = await dbGet('booking:'+id);
        if(!again || again.status!=='confirmed') return;
      }
    }
    await finishBookingNow(id, noShow);
  } finally { finishLocks.delete(id); }
}
async function finishBookingNow(id, noShow){
  const b = await dbGet('booking:'+id);
  if(!b || b.status!=='confirmed') return; // guard against double-deduction
  b.status = noShow ? 'no_show' : 'completed';
  b.completedAt = new Date().toISOString();
  await dbSet('booking:'+id, b);

  // deduct exactly one session from the linked package instance
  if(b.packageInstanceId){
    const pkg = await dbGet('custpkg:'+b.packageInstanceId);
    if(pkg && pkg.remainingSessions>0){
      pkg.usedSessions += 1;
      pkg.remainingSessions -= 1;
      if(pkg.remainingSessions<=0) pkg.status = 'used_up';
      await dbSet('custpkg:'+pkg.id, pkg);
      await pushNotification(b.customerId, 'nav_c_package', noShow?'notif_noshow':'notif_done', {who:b.trainerName, count:pkg.remainingSessions}, b.id);
      if(pkg.remainingSessions<=0) await pushNotification(b.customerId, 'nav_c_package', 'notif_full', {}, b.id);
    }
  }
  toast(noShow? t('ts_toast_noshow') : t('ts_toast_done'));
  renderView();
}

  const year = document.getElementById('newCertYear').value.trim();
  const prevBox = document.getElementById('newCertPreview');
  const imgData = (prevBox && prevBox.dataset.img) || '';
  const tr = await dbGet('trainer:'+session.id);
  tr.certs = tr.certs || [];
  const cert = {name, issuer, year};
  if(imgData){
    cert.imgId = newId('ci');                       // the picture lives under its own key so trainer lists stay small
    await dbSet('certimg:'+cert.imgId, {data:imgData, ownerId:tr.id, createdAt:new Date().toISOString()});
  }
  tr.certs.push(cert);
  await dbSet('trainer:'+tr.id, tr);
  toast(t('tpz_toast_cert_added'));
  // Refresh only the certificates card — a full renderView() would rebuild
  // the personal-info fields from the database and discard any unsaved
  // edits the trainer made to name/specialty/phone/bio before saving.
  await refreshCertsCard();
}
async function removeCert(idx){
  const tr = await dbGet('trainer:'+session.id);
  const gone = tr.certs.splice(idx,1)[0];
  await dbSet('trainer:'+tr.id, tr);
  if(gone && gone.imgId){ try{ await dbDelete('certimg:'+gone.imgId); }catch(e){} }
  toast(t('tpz_toast_cert_removed'));
  await refreshCertsCard();
}

/* The numbers on the admin pages: the server counts them (one small answer). A database without that call falls back to counting the lists. */
async function adminStats(){
  if(listCache.has('@stats')) return listCache.get('@stats');
  let st = null;
  try{
    needSignIn();
    const r = await rpc('app_admin_stats', {p_token:authToken});
    if(r && r.ok && r.trainers != null && r.customers != null){
      st = {trainers:Number(r.trainers), customers:Number(r.customers), apps:Number(r.apps), appsPending:Number(r.appsPending),
            packages:Number(r.packages), bookings:Number(r.bookings), activePkgs:Number(r.activePkgs)};
    }
  }catch(e){ if(!(e instanceof DbError)) throw e; }
  if(!st){
    const [trainers, customers, apps, packages, bookings, custPkgs] = await Promise.all([
      dbGetAll('trainer:'), dbGetAll('customer:'), dbGetAll('trainerApp:'),
      dbGetAll('tpkg:'), dbGetAll('booking:'), dbGetAll('custpkg:')
    ]);
    st = {trainers:trainers.length, customers:customers.length, apps:apps.length, appsPending:apps.filter(a=>a.status==='pending').length,
          packages:packages.filter(p=>p.status==='active' && Number(p.price)>0).length, bookings:bookings.length,
          activePkgs:custPkgs.filter(p=>p.status==='active').length};
  }
  listCache.set('@stats', st);
  return st;
}

const appActionBusy = new Set();
async function approveApp(id, approve){
  if(appActionBusy.has(id)) return; // ignore a second click while the first is still in flight
  appActionBusy.add(id);
  try{
    if(approve){
      const r = await rpc('app_approve_trainer', {p_token:authToken, p_app_id:id});     // the server creates the trainer, the code and the account
      if(r && r.ok){
        await pushNotification(r.trainerId, 'nav_t_dashboard', 'notif_approved', {}, null);
        toast(t('aa_toast_approve'));
      }
    } else {
      await rpc('app_reject_trainer', {p_token:authToken, p_app_id:id});
      toast(t('aa_toast_reject'));
    }
    clearRenderCaches();
    renderView(); renderNav();
  }catch(e){
    if(e instanceof ApiError && e.status!==401){ toast(apiErrText(e)); renderView(); return; }
    throw e;
  } finally { appActionBusy.delete(id); }
}

function loginFailText(r){
  if(!r) return t('auth_toast_wrong');
  if(r.reason==='locked') return lockedText(r);
  if(r.reason==='suspended') return t('auth_toast_suspended');
  if(r.reason==='pending') return t('auth_toast_pending');
  return t('auth_toast_wrong');
}
function authApiErr(e){
  if(e instanceof ApiError && e.status!==401){ authError = e.status===429 ? t('auth_toast_rate') : apiErrText(e); renderAuth(); return true; }
  return false;
}
async function doLoginInner(){
  const id = (document.getElementById('authId').value||'').trim();
  const pw = (document.getElementById('authPw').value||'').trim();
  if(!id || !pw){ authError = t('auth_toast_fill'); renderAuth(); return; }
  let r;
  try{ r = await rpc('app_login', {p_role:authRole, p_id:id, p_pw:pw}); }      // the password is checked on the server and goes nowhere else
  catch(e){ if(authApiErr(e)) return; throw e; }
  if(!(r && r.ok && r.token && r.user)){ authError = loginFailText(r); renderAuth(); return; }
  startSession(r.token, r.user);
  authError=''; route='dashboard'; routeParams={};
  if(session.role==='customer') await applyPendingTrainerCodeIfAny();
  renderRoot();
}

async function doRegisterInner(){
  if(authSubmitting) return;
  authSubmitting = true;
  try{
    const name = (document.getElementById('regName').value||'').trim();
    const phone = (document.getElementById('regPhone').value||'').trim();
    const pw = (document.getElementById('regPw').value||'').trim();
    if(!name || !phone || !pw){ authError = t('auth_toast_fill'); renderAuth(); return; }
    let r;
    try{ r = await rpc('app_register_customer', {p_name:name, p_phone:phone, p_pw:pw}); }
    catch(e){ if(authApiErr(e)) return; throw e; }
    if(!(r && r.ok && r.token && r.user)){
      authError = (r && r.reason==='phone_used') ? t('auth_toast_phone_used') : (r && r.reason==='weak') ? t('auth_toast_weak') : t('auth_toast_invalid');
      renderAuth(); return;
    }
    startSession(r.token, r.user);
    regDraft = {name:'', phone:'', pw:''};
    toast(t('auth_toast_registered'));
    authError=''; route='trainers'; routeParams={};
    await applyPendingTrainerCodeIfAny();
    renderRoot();
  } finally { authSubmitting = false; }
}

async function doApplyInner(){
  if(authSubmitting) return;
  authSubmitting = true;
  try{
    const name = (document.getElementById('apName').value||'').trim();
    const specialty = (document.getElementById('apSpecialty').value||'').trim();
    const phone = (document.getElementById('apPhone').value||'').trim();
    const gApp = googleApplicant;
    const pw = gApp ? '' : (document.getElementById('apPw').value||'').trim();
    const bio = (document.getElementById('apBio').value||'').trim();
    if(!name || !phone || (!pw && !gApp)){ authError = t('auth_toast_fill'); renderAuth(); return; }
    const app = {name, specialty, phone, bio, certs: pendingApplicationCerts.map(c=>({name:c.name, issuer:c.issuer, year:c.year}))};
    if(pendingApplicationPhoto) app.photo = pendingApplicationPhoto;
    let r;
    try{ r = await rpc('app_apply_trainer', {p_app:app, p_pw: gApp ? null : pw, p_ticket: gApp ? gApp.ticket : null}); }
    catch(e){ if(authApiErr(e)) return; throw e; }
    if(!(r && r.ok)){
      const why = r && r.reason;
      if(why==='ticket'){ clearGoogleApplicant(); authError = t('google_ticket_expired'); }
      else if(why==='exists' || why==='pending'){ clearGoogleApplicant(); authError = t('auth_toast_pending'); }
      else if(why==='phone_used') authError = t('auth_toast_phone_used');
      else if(why==='weak') authError = t('auth_toast_weak');
      else authError = t('auth_toast_invalid');
      renderAuth(); return;
    }
    // certificate pictures follow one by one; the application only keeps their ids
    let failedPictures = 0;
    for(let i = 0; i < pendingApplicationCerts.length; i++){
      const img = pendingApplicationCerts[i].img;
      if(!img) continue;
      try{ await rpc('app_apply_cert', {p_app_id:r.appId, p_ut:r.uploadToken, p_idx:i, p_img:img}); }
      catch(e){ if(e instanceof DbError) failedPictures++; else throw e; }
    }
    pendingApplicationCerts = []; pendingApplicationPhoto = '';
    applyDraft = {name:'', specialty:'', phone:'', pw:'', bio:''};
    clearGoogleApplicant();
    // the application is complete: the server accepts it now and hands back a sign-in
    let f = null;
    try{ f = await rpc('app_finish_apply', {p_app_id:r.appId, p_ut:r.uploadToken}); }
    catch(e){ if(!(e instanceof DbError)) throw e; }     // a dropped connection: the application is saved, signing in finishes it
    if(!(f && f.ok && f.token && f.user)){
      toast(t('auth_toast_applied_signin'));
      authMode='login'; authError=''; renderAuth(); return;
    }
    startSession(f.token, f.user);
    authError=''; route='dashboard'; routeParams={};
    toast(t(failedPictures ? 'auth_toast_applied_noimg' : 'auth_toast_applied'));
    renderRoot();
  } finally { authSubmitting = false; }
}

/* Who started the Google trip (customer or trainer, signing in or linking), kept for the round trip. */
function writeGoogleIntent(intent){
  const raw = JSON.stringify(Object.assign({role:'customer', mode:'login'}, intent||{}, {ts:Date.now()}));
  try{ sessionStorage.setItem(GOOGLE_INTENT_KEY, raw); }catch(e){}
  try{ localStorage.setItem(GOOGLE_INTENT_KEY, raw); }catch(e){}
}
/* null = this browser never started a Google sign-in recently, so whatever token arrived is not trusted.
   (Otherwise a crafted link carrying somebody else's Google token could log a person into the sender's account.) */
function readGoogleIntent(){
  let it = null;
  for(const st of [sessionStorage, localStorage]){
    try{ const raw = st.getItem(GOOGLE_INTENT_KEY); if(raw && !it) it = JSON.parse(raw); st.removeItem(GOOGLE_INTENT_KEY); }catch(e){}
  }
  if(!it || (Date.now() - (it.ts||0)) > 30*60*1000) return null;
  if(it.role!=='trainer') return {role:'customer', mode:'login'};
  return {role:'trainer', mode: it.mode==='link' ? 'link' : 'login', trainerId: String(it.trainerId||'')};
}
/* A person who signed in with Google as a trainer but has no account yet: their (server-verified) Google identity,
   kept while they fill in the application. */
let googleApplicant = null;
try{ googleApplicant = JSON.parse(sessionStorage.getItem(GOOGLE_APPLICANT_KEY) || 'null'); }catch(e){ googleApplicant = null; }
function clearGoogleApplicant(){ googleApplicant = null; try{ sessionStorage.removeItem(GOOGLE_APPLICANT_KEY); }catch(e){} }
let googleNote = '';  // a message to show once the screen is up (used when linking, where there is no login screen)

/* A trainer's Google account is attached to the account that is signed in right now. */
async function finishGoogleLink(ret, intent, fail, revoke){
  const saved = readSavedSession();
  if(!saved || saved.role!=='trainer' || saved.id!==intent.trainerId){ revoke(); return fail('google_failed'); }
  const who = await rpc('app_whoami', {p_token:saved.token});          // a lost connection propagates so the boot can retry
  if(!(who && who.ok && who.user && who.user.role==='trainer' && who.user.id===saved.id)){ revoke(); clearActiveSession(); return fail('google_failed'); }
  authToken = saved.token; session = {id:who.user.id, role:'trainer', name:who.user.name}; route = 'profile'; routeParams = {};
  let r;
  try{ r = await rpc('app_google_link', {p_token:saved.token}, {bearer: ret.token}); }
  catch(e){ revoke(); if(e instanceof ApiError){ googleNote = t('google_failed'); return true; } throw e; }
  revoke();
  googleNote = t(r && r.ok ? 'google_link_done' : (r && r.reason==='taken') ? 'google_link_taken' : (r && r.reason==='other') ? 'google_link_other' : 'google_failed');
  return true;
}

/* Runs at boot. Returns true when a Google sign-in was completed and a session now exists. */
async function finishGoogleLogin(){
  let ret = googleReturnMem; googleReturnMem = null;
  try{ const raw = sessionStorage.getItem(GOOGLE_RETURN_KEY); if(raw){ if(!ret) ret = JSON.parse(raw); sessionStorage.removeItem(GOOGLE_RETURN_KEY); } }catch(e){}
  if(!ret) return false;
  const intent = readGoogleIntent();
  if(!intent){ authRole = 'customer'; authMode = 'login'; authError = t('google_failed'); return false; }   // not started from this browser: ignore the token
  const linking = intent.role==='trainer' && intent.mode==='link';
  const fail = (key)=>{ if(linking) googleNote = t(key); else authError = t(key); return false; };
  authRole = intent.role; authMode = 'login';
  if(ret.error) return fail(ret.denied ? 'google_cancelled' : 'google_failed');
  // the Google token has done its job once our server has seen it -- revoke it so nothing keeps a live login for this browser
  const revoke = ()=>{ try{ fetch(SUPABASE_URL + '/auth/v1/logout?scope=local', { method:'POST', headers:{ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + ret.token }, keepalive:true }).catch(()=>{}); }catch(e){} };

  try{
    clearRenderCaches();
    if(linking) return await finishGoogleLink(ret, intent, fail, revoke);

    let g;
    try{ g = await rpc('app_google_login', {p_role:intent.role}, {bearer: ret.token}); }
    catch(e){
      if(e instanceof ApiError){ revoke(); return fail(e.status===429 ? 'auth_toast_rate' : 'google_failed'); }
      throw e;
    }
    revoke();
    const why = g && g.reason;
    if(g && g.ok && g.token && g.user){
      startSession(g.token, g.user);
      authError = ''; route = (intent.role==='customer' && g.created) ? 'trainers' : 'dashboard'; routeParams = {};
      if(intent.role==='customer'){
        try{ const sc = localStorage.getItem(GOOGLE_CODE_KEY); if(sc){ localStorage.removeItem(GOOGLE_CODE_KEY); if(!pendingTrainerCode) pendingTrainerCode = sc; } }catch(e){}
        if(g.created) toast(t('google_welcome'));
      }
      return true;
    }
    if(why==='suspended'){ authError = t('auth_toast_suspended'); return false; }
    if(why==='pending'){ authError = t('auth_toast_pending'); return false; }
    if(why==='none' && g.ticket && g.applicant && intent.role==='trainer'){
      // first time: carry on as a trainer application (it is accepted as soon as it is sent)
      const email = String(g.applicant.email || '').trim().toLowerCase();
      googleApplicant = {ticket:g.ticket, gid:g.applicant.gid, email, name: String(g.applicant.name || '').trim() || email.split('@')[0] || ''};
      try{ sessionStorage.setItem(GOOGLE_APPLICANT_KEY, JSON.stringify(googleApplicant)); }catch(e){}
      authMode = 'apply'; authError = '';
      pendingApplicationCerts = []; pendingApplicationPhoto = '';
      applyDraft = {name:googleApplicant.name, specialty:'', phone:'', pw:'', bio:''};
      return false;
    }
    return fail('google_failed');
  }catch(e){
    // the database could not be reached: keep the (still valid, short-lived) sign-in so the boot retry can finish it
    if(e instanceof DbError && !(e instanceof ApiError)){
      googleReturnMem = ret;
      try{ sessionStorage.setItem(GOOGLE_RETURN_KEY, JSON.stringify(ret)); }catch(x){}
      writeGoogleIntent(intent);
    }
    throw e;
  }
}

/* ---------------- device preview toggle ----------------
   Opens the current page inside a phone- or desktop-sized frame
   so mobile and desktop layouts can both be checked from one
   window, without touching or resetting the live app above. */
(function initDevicePreview(){
  const btn = document.getElementById('devicePreviewBtn');
  const icon = document.getElementById('devicePreviewIcon');
  const overlay = document.getElementById('deviceFrameOverlay');
  const label = document.getElementById('deviceFrameLabel');
  const closeBtn = document.getElementById('deviceFrameClose');
  const shell = document.getElementById('deviceFrameShell');
  const iframe = document.getElementById('deviceFrameIframe');
  if(!btn || !overlay) return;

  // Inside the preview iframe itself, hide the toggle so the phone/
  // desktop frame can't be opened recursively from within its own copy.
  if(window.frameElement){ btn.style.display = 'none'; return; }

  function isNarrow(){ return window.innerWidth <= 820; }
  function syncIcon(){ icon.textContent = isNarrow() ? '🖥️' : '📱'; }
  syncIcon();
  window.addEventListener('resize', syncIcon);

  function openPreview(){
    const mobile = !isNarrow();
    if(mobile){
      shell.style.width = '390px';
      shell.style.height = '780px';
      label.textContent = 'Mobile preview (390px)';
    }else{
      shell.style.width = '1180px';
      shell.style.height = '760px';
      label.textContent = 'Desktop preview (1180px)';
    }
    iframe.srcdoc = '<!DOCTYPE html>' + document.documentElement.outerHTML;
    overlay.classList.add('show');
  }
  function closePreview(){
    overlay.classList.remove('show');
    iframe.srcdoc = 'about:blank';
  }
  btn.addEventListener('click', openPreview);
  closeBtn.addEventListener('click', closePreview);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closePreview(); });
})();

/* ---------------- auto-refresh ----------------
   Data can now change from a completely different device (a customer
   booking on their phone while a trainer has this app open on theirs),
   and nothing here was pushing that change onto an already-open screen —
   the person had to manually reload to see it. This polls quietly in
   the background and re-renders the current screen when the tab is
   visible, so new requests/approvals/bookings show up on their own.
   It skips a tick whenever an input/textarea/select is focused, so it
   never wipes out something the person is in the middle of typing. */
function shouldSkipAutoRefresh(){
  const tag = document.activeElement && document.activeElement.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}
let refreshBusy = false;
async function softRefresh(force){
  if(!session || gateActive || refreshBusy || connState==='offline') return;
  if(document.hidden) return;
  if(shouldSkipAutoRefresh()) return;
  if(session.role==='customer' && route==='profile') return;       // nothing here changes by itself, and a half-filled form must not be wiped
  if(force !== true && Date.now() - lastRefreshAt < REFRESH_MIN_GAP_MS) return;   // flicking back and forth does not re-download
  refreshBusy = true;
  lastRefreshAt = Date.now();                                                      // a failing server is not hammered either
  try{ await renderRoot(true); } finally { refreshBusy = false; }
}
/* Every refresh downloads the lists again, so it is paced: once a minute while somebody is using the page, once every
   five minutes after they stop touching it, never while the page is hidden, and straight away (when the data is older
   than 20 seconds) when they come back to it. The timer itself only wakes up every 15 seconds and costs nothing. */
function refreshTick(){
  const idle = Date.now() - lastActivityAt > IDLE_AFTER_MS;
  const gap = idle ? REFRESH_IDLE_MS : REFRESH_ACTIVE_MS;
  if(Date.now() - lastRefreshAt >= gap - 1000) softRefresh();
}
function noteActivity(){
  const now = Date.now();
  const wasIdle = now - lastActivityAt > IDLE_AFTER_MS;
  lastActivityAt = now;
  if(wasIdle) softRefresh();                       // back at a page that was left alone: show current data
}
['pointerdown','keydown','touchstart','wheel'].forEach(ev=> window.addEventListener(ev, noteActivity, {passive:true, capture:true}));
setInterval(refreshTick, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) softRefresh(); });
window.addEventListener('focus', ()=> softRefresh());

/* ---------------- service worker ---------------- */
if('serviceWorker' in navigator){
  // messages from the pop-up code in the service worker: a new notification arrived / a pop-up was tapped
  navigator.serviceWorker.addEventListener('message', (ev)=>{
    const d = (ev && ev.data) || {};
    if(!session || session.role === 'admin') return;
    if(d.type === 'tk-open'){ go('notif'); }
    else if(d.type === 'tk-new'){ softRefresh(true); }
  });
}
if('serviceWorker' in navigator && !window.frameElement){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ---------------- boot ---------------- */
(function clearLocalIfRequested(){
  // One-time maintenance hatch: visiting ?clearlocal=1 does a FULL reset of
  // everything this browser (this one, specifically) might be holding for
  // this app -- old/duplicate records stuck locally, a stale cached copy of
  // the app shell from the service worker, etc. The real data in Supabase
  // is never touched by this. Use it whenever a browser seems to be
  // showing stale/duplicate data that isn't actually in the real database.
  try{
    const sp = new URLSearchParams(location.search);
    if(sp.get('clearlocal')==='1'){
      Object.keys(localStorage).forEach(k=>{ if(k.indexOf('hug-yim-plus-fitness')===0 || k==='trainkrub:activeSession' || k.indexOf('trainkrub:google')===0) localStorage.removeItem(k); });
      try{ Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf('trainkrub:google')===0) sessionStorage.removeItem(k); }); }catch(e){}
      const cleanUrl = new URL(location.href);
      cleanUrl.searchParams.delete('clearlocal');
      let finished = false;
      const finish = () => { if(finished) return; finished = true; location.replace(cleanUrl.toString()); };
      const jobs = [];
      if(window.caches && caches.keys) jobs.push(caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(()=>{}));
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(r => r.unregister()))).catch(()=>{}));
      Promise.all(jobs).then(finish).catch(finish);
      setTimeout(finish, 2000); // safety net in case the above hangs
      return;
    }
  }catch(e){}
})();

let bootBusy = false;
async function bootApp(){
  document.getElementById('app').innerHTML = splashHtml();
  const slowNote = setTimeout(()=>{ const n = document.getElementById('splashNote'); if(n) n.textContent = t('splash_slow'); }, 5000);
  try{
  if(!(await finishGoogleLogin())) await resumeActiveSession();
  await applyPendingTrainerCodeIfAny();
  try{                                              // opened from a pop-up: go straight to the notifications
    const sp0 = new URLSearchParams(location.search);
    if(sp0.get('go') === 'notif'){
      if(session && session.role !== 'admin') route = 'notif';
      sp0.delete('go');
      history.replaceState(null, '', location.pathname + (sp0.toString() ? '?' + sp0.toString() : '') + location.hash);
    }
  }catch(e){}
  } finally { clearTimeout(slowNote); }
  if(!session && googleApplicant){ authRole = 'trainer'; authMode = 'apply'; if(!applyDraft.name) applyDraft.name = googleApplicant.name || ''; }
  await renderRoot();
  if(googleNote){ toast(googleNote); googleNote = ''; }
}
/* Starts (or restarts, from the "Retry" button / when the connection comes back) the app. */
async function runBoot(){
  if(bootBusy) return;
  bootBusy = true; gateActive = false;
  try{ await bootApp(); }
  catch(e){
    if(e instanceof DbError) showOfflineGate();
    else { console.error(e); throw e; }
  } finally { bootBusy = false; }
}
(async function boot(){
  purgeLegacyLocalData();
  renderConnBanner();
  await ensureFreshServiceWorker();
  await runBoot();
})();
